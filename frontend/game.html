<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐치피싱 피싱 대응 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   캐치피싱 체험 화면 (A 11/19)
   하는 일: 개인용·기관용 체험. 사전 4문제 → 연쇄형 연습 → (개인용 게임 / 기관용 따라 쓰기) → 사후 4문제 → 전후 결과
   참고: 동작은 11/14 시안, 해설·결과 세부는 예전 game.html, 겉모양은 포스터 테마 (첫 화면과 같은 색·글꼴·카드)
   ===================================================================== */
/* ===== 포스터 테마 (A 11/19, 포스터 2장 색·글꼴·카드 모양을 사이트에 옮김) =====
   색: 포스터 파일에서 뽑은 값 (A 개인 메모 5번). 글꼴: 제목 주아체(Jua), 본문 본고딕(Noto Sans KR), 둘 다 OFL (B 11/16)
   카드: 흰 바탕 + 남색 두꺼운 테두리 + 오른쪽 아래 진한 그림자 (포스터 "이런 걸 할 수 있어요" 카드) */
:root {
  color-scheme: light;
  --bg: #E7ECF4; --dot: #CBD5E5; --paper: #FFFFFF; --field: #F2F5FA; --line: #D3DCEA;
  --navy: #0F1F45; --ink: #1B2A41; --muted: #56657D; --blue: #2563C9; --blue-soft: #E3ECFA; --circle: #CFDCF0;
  --point: #FFE699; --mascot: #3B7BE0; --shadow: #B8C4D8;
  --danger: #C62828; --danger-soft: #FDECEC; --caution: #8A5A00; --caution-soft: #FFF3D1; --safe: #1E7A4E; --safe-soft: #E3F4EA;
  --title: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-card: 22px; --r-btn: 14px; --bw: 2.5px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; font-size: 17px; }
@media (min-width: 56rem) { html { font-size: 19px; } }   /* 글씨 크게 (A 11/20: 전체적으로 너무 작음) */
body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg) radial-gradient(var(--dot) 1.3px, transparent 1.5px) 0 0 / 20px 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리줄과 메뉴 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .7rem;
  padding: .6rem 1rem; padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.menu-btn { width: 2.7rem; height: 2.7rem; border-radius: 12px; border: var(--bw) solid var(--navy); background: var(--paper);
  box-shadow: 3px 3px 0 var(--shadow); font-size: 1.15rem; line-height: 1; color: var(--navy); }
.logo { display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--navy); font-family: var(--title); font-size: 1.45rem; line-height: 1; }
.logo .app { width: 2.3rem; height: 2.3rem; border-radius: 10px; background: var(--blue); display: grid; place-items: center; box-shadow: 2px 3px 0 var(--navy); }
.side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(80vw, 17rem); background: var(--paper); border-right: var(--bw) solid var(--navy);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 1rem; transform: translateX(-105%); transition: transform .2s; display: flex; flex-direction: column; gap: .3rem; }
.side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(15, 31, 69, .4); }
.side a { display: block; padding: .75rem .9rem; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; }
.side a:hover { background: var(--blue-soft); }
.side .side-head { font-family: var(--title); font-size: 1.2rem; color: var(--navy); padding: .2rem .9rem .5rem; }
.main { padding: 1rem 1rem 2.5rem; max-width: 64rem; margin: 0 auto; }
main:focus { outline: none; }

/* 공통 조각 */
.card { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); }
.h-sec { font-family: var(--title); font-weight: 400; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); color: var(--navy); line-height: 1.25; }
.band { background: linear-gradient(transparent 46%, var(--point) 46%, var(--point) 92%, transparent 92%); }
.num { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--point); border: var(--bw) solid var(--navy); color: var(--navy);
  display: grid; place-items: center; font-family: var(--title); font-size: 1.35rem; line-height: 1; flex: none; }
.chip { display: inline-flex; align-items: center; border: var(--bw) solid var(--navy); background: var(--paper); border-radius: 999px; padding: .3rem 1rem;
  font-weight: 700; color: var(--navy); font-size: .92rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: var(--bw) solid var(--navy); border-radius: var(--r-btn);
  padding: .8rem 1.5rem; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--navy); transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--navy); }
.btn.sub { background: var(--paper); color: var(--navy); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== 체험 화면 (A 11/19, 포스터 테마) ===== */
.step { font-size: .88rem; color: var(--blue); font-weight: 700; margin-bottom: .35rem; }
.title { font-family: var(--title); font-weight: 400; font-size: clamp(1.55rem, 1.25rem + 1.3vw, 2.2rem); color: var(--navy); line-height: 1.3; margin-bottom: .5rem; }
.lead { color: var(--muted); max-width: 38rem; margin-bottom: 1.2rem; }
.note { font-size: .85rem; color: var(--muted); margin-top: .8rem; }
.muted { color: var(--muted); }
.row { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 1.5rem; }
.error { color: var(--danger); font-size: .9rem; font-weight: 500; margin-top: .8rem; }
.data-tag { display: inline-block; font-size: .75rem; font-weight: 700; color: var(--navy); background: var(--point); border: 2px solid var(--navy); border-radius: 999px; padding: 0 .55rem; margin-left: .3rem; vertical-align: middle; }

/* 진행 표시 (포스터 "체험은 이렇게 흘러가요") */
.stepper { list-style: none; margin: .2rem 0 1.4rem; padding: .65rem .9rem; display: flex; gap: .3rem; align-items: center; overflow-x: auto; scrollbar-width: none; }
.stepper::-webkit-scrollbar { display: none; }
.stepper li { display: flex; align-items: center; gap: .4rem; font-size: .85rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.stepper li:not(:last-child)::after { content: ""; width: 1.3rem; border-top: 2.5px dashed var(--line); margin: 0 .15rem; }
.stepper .n { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--paper); font-family: var(--title); font-size: .95rem; }
.stepper .done { color: var(--navy); }
.stepper .done .n { background: var(--blue); border-color: var(--navy); color: #fff; }
.stepper .now { color: var(--navy); }
.stepper .now .n { background: var(--point); border-color: var(--navy); color: var(--navy); }
@media (max-width: 39.99rem) { .mail { min-height: 0; } .mail-list { padding-bottom: .4rem; } .stepper .n { width: 1.45rem; height: 1.45rem; font-size: .8rem; } .stepper li:not(.now) .t { display: none; } .stepper li:not(:last-child)::after { width: .55rem; } .stepper { gap: .15rem; padding: .55rem .7rem; } }

/* 고르기·사전질문 */
.go3 { display: grid; gap: 1.1rem; margin-top: 1.2rem; }
.go { display: flex; flex-direction: column; gap: .2rem; padding: 1.2rem 1.2rem 1.1rem; text-decoration: none; color: var(--navy); text-align: left;
  border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); transition: transform .12s, box-shadow .12s; }
.go:hover { transform: translate(-2px, -3px); box-shadow: 8px 10px 0 var(--shadow); }
.go svg { width: 2.4rem; height: 2.4rem; padding: .35rem; border-radius: 12px; margin-bottom: .8rem; flex: none; }
.go b { font-family: var(--title); font-weight: 400; font-size: 1.7rem; line-height: 1.2; }
.go .kw { font-weight: 700; font-size: .9rem; }
.go .ds { margin-top: .3rem; font-size: .93rem; line-height: 1.55; }
.go.p { background: var(--blue); color: #fff; }
.go.p svg { background: rgba(255,255,255,.18); }
.go.o { background: var(--paper); }
.go.o svg { background: var(--blue-soft); color: var(--blue); }
.go.o .kw { color: var(--blue); }
@media (min-width: 40rem) { .go3 { grid-template-columns: repeat(2, minmax(0, 20rem)); } .go { min-height: 12rem; } }
.back-btn { border: 0; background: none; color: var(--navy); font-weight: 700; padding: .2rem 0; margin-bottom: .8rem; text-decoration: none; display: inline-block; }
.pick { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); }
.pick.scale { grid-template-columns: repeat(5, 1fr); }
.pick.scale button { text-align: center; font-family: var(--title); font-size: 1.3rem; padding: .6rem 0; }
.scale-cap { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: .4rem; }
.pick button { border: var(--bw) solid var(--navy); background: var(--paper); border-radius: var(--r-btn); padding: .85rem 1rem; text-align: left; font-weight: 500;
  box-shadow: 3px 4px 0 var(--shadow); transition: transform .08s, box-shadow .08s; }
.pick button:hover { background: var(--blue-soft); }
.pick button[aria-pressed="true"] { background: var(--blue); color: #fff; box-shadow: 1px 1px 0 var(--shadow); transform: translate(2px, 3px); }
.q { margin: 1.5rem 0 .65rem; font-weight: 700; color: var(--navy); }
.field { width: 100%; max-width: 24rem; padding: .8rem 1rem; border: var(--bw) solid var(--navy); border-radius: var(--r-btn); background: var(--paper); }

/* 메시지 화면 배치: 폰은 위아래, 넓은 화면은 메시지 | 선택지 */
.stage { position: relative; display: grid; gap: 1.4rem; }
@media (min-width: 56rem) { .stage { grid-template-columns: minmax(0, 1fr) 22rem; align-items: start; } .choices { position: sticky; top: 5rem; } }

/* 문자: 포스터의 남색 폰 */
.sms { position: relative; max-width: 24rem; width: 100%; margin: 0 auto; background: var(--paper); border: 11px solid var(--navy); border-radius: 42px;
  box-shadow: 8px 10px 0 var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 26rem; }
.sms::before { content: ""; display: block; width: 5.2rem; height: .42rem; border-radius: 999px; background: var(--navy); margin: .55rem auto .1rem; flex: none; }
.sms-top { display: flex; align-items: center; gap: .6rem; padding: .5rem 1rem .75rem; border-bottom: 1.5px solid var(--line); }
.sms-top .back { font-size: 1.5rem; line-height: 1; color: var(--muted); }
.avatar { width: 2.3rem; height: 2.3rem; border-radius: 50%; background: var(--circle); display: grid; place-items: center; color: var(--navy); font-weight: 900; flex: none; }
.sms-top .who { font-weight: 700; color: var(--navy); }
.sms-top .who small { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
.sms-thread { flex: 1; padding: 1rem .95rem; display: flex; flex-direction: column; gap: .5rem; }
.day { text-align: center; font-size: .75rem; color: var(--muted); margin-bottom: .2rem; }
.sms-thread .day:not(:first-child) { margin-top: .8rem; }
.bubble-row { display: flex; align-items: flex-end; gap: .4rem; }
.bubble { background: var(--field); border: 1.5px solid var(--line); border-radius: 20px 20px 20px 6px; padding: .7rem .9rem; max-width: 86%; font-size: .95rem; }
.bubble .lnk { color: var(--blue); text-decoration: underline; word-break: break-all; }
.bubble-row time { font-size: .7rem; color: var(--muted); flex: none; white-space: nowrap; }
.sms-input { display: flex; gap: .5rem; align-items: center; padding: .6rem .9rem 1rem; color: var(--muted); }
.sms-input .box { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: .35rem .9rem; font-size: .85rem; }
@media (max-width: 39.99rem) { .sms { min-height: 0; border-width: 9px; border-radius: 34px; } .sms-thread { padding-bottom: 1.4rem; } }

/* 메일: 남색 테두리 카드 */
.mail-wrap { container-type: inline-size; }
.mail { border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); overflow: hidden; background: var(--paper); min-height: 26rem; display: flex; flex-direction: column; }
.mail-bar { display: flex; align-items: center; gap: .6rem; padding: .75rem 1rem; border-bottom: 2px solid var(--navy); font-weight: 700; color: #fff; background: var(--navy); }
.mail-bar .search { margin-left: auto; font-weight: 400; font-size: .8rem; color: var(--navy); background: var(--paper); border-radius: 999px; padding: .2rem .8rem; }
.mail-body { flex: 1; display: grid; }
.mail-row { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .6rem; width: 100%; text-align: left; padding: .85rem 1rem; border: 0; border-bottom: 1.5px solid var(--line); background: none; }
.mail-row .dot { grid-row: span 2; width: .6rem; height: .6rem; border-radius: 50%; margin-top: .5rem; background: transparent; }
.mail-row.new .dot { background: var(--blue); }
.mail-row .nm { font-size: .95rem; }
.mail-row.new .nm, .mail-row.new .sj { font-weight: 700; color: var(--navy); }
.mail-row time { font-size: .75rem; color: var(--muted); }
.mail-row .sj { grid-column: 2 / -1; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-row.old { opacity: .5; cursor: default; }
.mail-row.on { background: var(--blue-soft); }
.mail-read { padding: 1.1rem 1.2rem 1.4rem; display: none; }
.mail[data-view="read"] .mail-read { display: block; }
.mail[data-view="read"] .mail-list { display: none; }
.mail-read .back { border: 0; background: none; color: var(--muted); padding: 0 0 .6rem; font-size: .9rem; }
.mail-read h3 { font-size: 1.15rem; line-height: 1.4; margin-bottom: .8rem; color: var(--navy); }
.from { display: flex; gap: .6rem; align-items: flex-start; }
.from .meta { flex: 1; min-width: 0; }
.from-name { border: 0; background: none; padding: 0; font-weight: 700; text-align: left; color: var(--navy); }
.from-name::after { content: " ▾"; font-weight: 400; color: var(--muted); font-size: .8rem; }
.from-name[aria-expanded="true"]::after { content: " ▴"; }
.from .to { display: block; font-size: .8rem; color: var(--muted); }
.from time { font-size: .78rem; color: var(--muted); }
.from-detail { margin: .5rem 0 0; background: var(--field); border-radius: 12px; padding: .6rem .8rem; font-size: .82rem; display: grid; grid-template-columns: auto 1fr; gap: .2rem .7rem; }
.from-detail dt { color: var(--muted); }
.from-detail dd { margin: 0; word-break: break-all; }
.mail-text { margin-top: 1.1rem; font-size: .95rem; white-space: pre-line; }
.mail-text .lnk { color: var(--blue); text-decoration: underline; word-break: break-all; }
.attach { margin-top: 1rem; display: inline-flex; gap: .6rem; align-items: center; border: 2px solid var(--line); border-radius: 12px; padding: .55rem .8rem; font-size: .85rem; }
.attach i { width: 1.6rem; height: 2rem; border-radius: 4px; background: var(--field); border: 1.5px solid var(--line); }
.empty-read { display: none; }
@container (min-width: 34rem) {
  .mail-body { grid-template-columns: 16.5rem 1fr; }
  .mail-list { border-right: 1.5px solid var(--line); }
  .mail[data-view] .mail-list { display: block; }
  .mail[data-view] .mail-read { display: block; }
  .mail-read .back { display: none; }
  .mail[data-view="list"] .mail-read > * { display: none; }
  .mail[data-view="list"] .mail-read .empty-read { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: .9rem; }
}

/* 선택지 */
.choices { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); padding: 1.2rem; }
.choices h2 { font-family: var(--title); font-weight: 400; font-size: 1.35rem; color: var(--navy); margin-bottom: .7rem; }
.timer { height: .7rem; border-radius: 999px; background: var(--field); border: 2px solid var(--navy); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--blue); transition: width 1s linear; }
.timer.over i { background: var(--point); }
.timer-txt { font-size: .8rem; color: var(--muted); margin: .35rem 0 .9rem; font-weight: 500; }
.opt { display: block; width: 100%; text-align: left; border: var(--bw) solid var(--navy); background: var(--paper); border-radius: var(--r-btn); padding: .85rem 1rem;
  margin-bottom: .7rem; font-size: .96rem; font-weight: 500; color: var(--ink); box-shadow: 3px 4px 0 var(--shadow); transition: transform .08s, box-shadow .08s, background .12s; }
.opt:hover:not(:disabled) { background: var(--blue-soft); }
.opt:active:not(:disabled) { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.wait-open { font-size: .95rem; color: var(--navy); font-weight: 700; margin-bottom: .8rem; background: var(--point); border: 2px solid var(--navy); border-radius: 12px; padding: .5rem .7rem; }
.wait-open .up { display: none; }
@media (max-width: 55.99rem) { .wait-open .left { display: none; } .wait-open .up { display: inline; } }
.mail-row.new { position: relative; animation: ring 1.4s ease-in-out infinite; }
.tap-me { grid-column: 2 / -1; justify-self: start; margin-top: .35rem; background: var(--point); color: var(--navy); border: 2px solid var(--navy); border-radius: 999px; font-size: .72rem; font-weight: 900; padding: 0 .5rem; }
@keyframes ring { 0%, 100% { box-shadow: inset 0 0 0 0 var(--point); } 50% { box-shadow: inset 0 0 0 4px var(--point); } }
.mail-row.on .tap-me { display: none; }

/* 선택 미리보기 */
.preview { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 85%, transparent); border-radius: var(--r-card); }
.preview .box { max-width: 24rem; width: calc(100% - 2rem); background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); padding: 1.3rem; }
.preview .lbl { font-size: .8rem; color: var(--muted); }
.preview .ch { font-weight: 700; margin: .2rem 0 .8rem; }
.preview .st { font-family: var(--title); font-size: 1.25rem; color: var(--navy); }
.preview .st.wait { color: var(--caution); }
.preview .bar { height: .6rem; background: var(--field); border: 2px solid var(--navy); border-radius: 999px; margin-top: .9rem; overflow: hidden; }
.preview .bar i { display: block; height: 100%; width: 0; background: var(--blue); animation: fill 2.2s linear forwards; }
@keyframes fill { to { width: 100%; } }

/* 해설 */
.verdict-big { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; margin-bottom: 1.3rem; border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); }
.verdict-big .ico { flex: none; width: 3.2rem; height: 3.2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--title); font-size: 1.8rem; background: var(--paper); border: var(--bw) solid var(--navy); color: var(--navy); }
.verdict-big b { display: block; font-family: var(--title); font-weight: 400; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); line-height: 1.2; }

<script>
/* =====================================================================

// 직군 (팀 결정)
const JOBS = [["hr", "인사"], ["finance", "재무·회계"], ["sales", "영업·고객"], ["dev", "개발·IT"], ["office", "일반 사무"]];

];

// 따라 쓰기 문장 (B의 대응 매뉴얼 문장 그대로, 예전 game.html)
const COPY_LINES = {

};

/* =====================================================================
   상태와 도우미
   ===================================================================== */
const $ = id => document.getElementById(id);
const main = $("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let S = {};
let timer = null;

function reset(mode) {
  S = { mode, job: null, target: mode === "org" ? "worker" : null, revisit: null, survey: {},
        anon: null, phase: "pre", round: 1, cards: [], idx: 0,
        answers: { pre: [], post: [] }, log: { pre: [], post: [] }, late: { pre: 0, post: 0 }, res: { pre: null, post: null },
        chainCard: null, chainSteps: [], chainResult: null };
}
// 하는 일: 서버로 보낼 때마다 붙는 공통 값 (서버 약속 1번 새 모양, 장부 새 칸)
const base = () => ({ mode: S.mode, job: S.mode === "org" ? S.job : null, target: S.target, revisit: S.revisit, self_check: S.survey });

async function post(url, body) {
  let res, data;
  try {
    res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    data = await res.json();
  } catch (e) { throw new Error("서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); }
  if (!res.ok) throw new Error(data.error || "서버에 연결하지 못했어요. 다시 눌러 주세요.");
  return data;
}
// 하는 일: 맨 위 진행 표시 (포스터 "체험은 이렇게 흘러가요" 6단계). 기관용은 게임 대신 따라 쓰기, 연쇄형 앞에 둔다
const STEPS = { personal: ["사전 체험", "해설", "연쇄형 연습", "게임 훈련", "사후 체험", "전후 비교"],
                org: ["사전 체험", "해설", "따라 쓰기", "연쇄형 연습", "사후 체험", "전후 비교"] };
function stepper(n) {
  return `<ol class="stepper card" aria-label="체험 순서">${STEPS[S.mode].map((t, i) => {
    const k = i + 1, cls = k < n ? "done" : k === n ? "now" : "";
    return `<li class="${cls}"${k === n ? ' aria-current="step"' : ""}><span class="n">${k}</span><span class="t">${t}</span></li>`; }).join("")}</ol>`;
}
function render(html, n) {
  clearInterval(timer);
  main.innerHTML = (n !== undefined && S.mode ? stepper(n) : "") + html;
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
}
const phaseName = () => S.phase === "pre" ? "사전 체험" : "사후 체험";
const modeName = () => S.mode === "org" ? "기관용" : "개인용";
// 하는 일: 버튼을 누르면 서버를 기다리는 동안 잠그고, 실패하면 오류 문장을 보여 주고 다시 누를 수 있게 한다
async function busy(btn, fn) {
  btn.disabled = true;
  main.querySelectorAll(".error").forEach(e => e.remove());
  try { await fn(); }
  catch (err) { btn.disabled = false; btn.insertAdjacentHTML("afterend", `<p class="error" role="alert">${esc(err.message)}</p>`); }
}

/* =====================================================================
   1. 고르기 → 직군 → 사전질문
   ===================================================================== */
function choose() {
  S = {};
  render(`
    <a class="back-btn" href="/">‹ 처음으로</a>
    <h1 class="title">어떤 체험을 할까요?</h1>
    <p class="lead">문자와 메일을 받고 어떻게 할지 골라 보는 체험이에요. 이름은 저장하지 않고, 결과는 익명으로 모여요.</p>
    <nav class="go3" aria-label="체험 고르기">
      <button class="go p" data-start="personal"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="7" y="3" width="14" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 9h6M11 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.5 21h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b>개인용</b><span class="kw">체험 · 게임 훈련</span><span class="ds">진짜 같은 문자·메일로 체험하고, 해설과 훈련 게임으로 반복 연습해요</span></button>
      <button class="go o" data-start="org"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 24V6l10-2v20M15 9h8v15M3 24h22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M9 10h2M9 14h2M9 18h2M19 13h0.01M19 17h0.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b>기관용</b><span class="kw">직원 교육 · 통계</span><span class="ds">직원은 직군별 메시지로 체험하고, 담당자는 약한 유형을 통계로 봐요</span></button>
    </nav>`);
  main.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(b.dataset.start));
}

function start(mode) { reset(mode); mode === "org" ? job() : survey(); }

// 하는 일: 문제를 풀기 전 화면에만 뒤로가기를 둔다. 답을 고르면 장부에 기록되어, 뒤로 가서 다시 고르면 전후 비교 숫자가 틀어지기 때문
function backBtn(label) { return `<button class="back-btn" id="back">‹ ${label}</button>`; }
function job() {
  render(`
    ${backBtn("체험 고르기")}
    <p class="step">기관용 체험</p>
    <h1 class="title">하는 일을 골라 주세요</h1>
    <p class="lead">내 직군에게 자주 오는 메시지가 하나 섞여요.</p>
    <div class="pick">${JOBS.map(([v, t]) => `<button data-v="${v}" aria-pressed="false">${t}</button>`).join("")}</div>
    <div class="row"><button class="btn" id="next" disabled>다음</button></div>`, 0);
  $("back").onclick = choose;
  if (S.job) { const on = main.querySelector(`[data-v="${S.job}"]`); if (on) { on.setAttribute("aria-pressed", "true"); $("next").disabled = false; } }
  main.querySelectorAll(".pick button").forEach(b => b.onclick = () => {
    main.querySelectorAll(".pick button").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true"); S.job = b.dataset.v; $("next").disabled = false;
  });
  $("next").onclick = survey;
}

function survey() {
  // 하는 일: 개인용은 대상, 해 본 적 있는지, 자신감(Q1). 기관용은 해 본 적 있는지와 문진표 Q1~Q4
  // 이유: 흐름 문서 1번. 대상과 해 본 적 있는지는 장부 새 칸(target, revisit)으로 들어가 관리자 통계에서 나눠 본다
  const qs = [];
  if (S.mode === "personal") qs.push(["target", "지금 어떤 분이세요?", [["student", "학생"], ["general", "일반인"]]]);
  qs.push(["revisit", "캐치피싱을 해 본 적 있나요?", [["true", "있어요"], ["false", "처음이에요"]]]);
  qs.push(["Q1", SURVEY[0].text, [1, 2, 3, 4, 5].map(n => [String(n), n === 1 ? "1 전혀 아니다" : n === 5 ? "5 매우 그렇다" : String(n)])]);
  if (S.mode === "org") SURVEY.slice(1).forEach(q => qs.push([q.id, q.text, q.options.map(o => [o, o])]));
  const ans = S.draft || (S.draft = {});   // 참고: 뒤로 갔다 와도 고른 답이 남아 있게
  render(`
    ${backBtn(S.mode === "org" ? "직군 고르기" : "체험 고르기")}
    <p class="step">${modeName()} 체험 · 시작 전</p>
    <h1 class="title">체험 전 사전질문</h1>
    <p class="lead">정답이 있는 질문이 아니에요. 평소 모습 그대로 답해 주세요. 결과 화면에서 내 생각과 실제 판단을 비교해 드려요.</p>
    ${qs.map(([k, q, opts]) => `<p class="q" id="q-${k}">${esc(q)}</p>
      <div class="pick${k === "Q1" ? " scale" : ""}" role="group" aria-labelledby="q-${k}">${opts.map(([v, t]) => `<button data-k="${k}" data-v="${esc(v)}" aria-pressed="false"${k === "Q1" ? ` aria-label="${esc(t)}"` : ""}>${esc(k === "Q1" ? v : t)}</button>`).join("")}</div>
      ${k === "Q1" ? `<p class="scale-cap" aria-hidden="true"><span>1 전혀 아니다</span><span>5 매우 그렇다</span></p>` : ""}`).join("")}
    <div class="row"><button class="btn" id="next" disabled>체험 시작</button></div>`, 0);
  $("back").onclick = () => S.mode === "org" ? job() : choose();
  main.querySelectorAll(".pick button").forEach(b => { if (ans[b.dataset.k] === b.dataset.v) b.setAttribute("aria-pressed", "true"); });
  $("next").disabled = !qs.every(q => ans[q[0]] != null);
  main.querySelectorAll(".pick button").forEach(b => b.onclick = () => {
    main.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true"); ans[b.dataset.k] = b.dataset.v;
    $("next").disabled = !qs.every(q => ans[q[0]] != null);
  });
  $("next").onclick = () => busy($("next"), async () => {
    if (S.mode === "personal") S.target = ans.target;
    S.revisit = ans.revisit === "true";
    S.survey = { Q1: Number(ans.Q1) };
    if (S.mode === "org") ["Q2", "Q3", "Q4"].forEach(k => S.survey[k] = ans[k]);
    // 서버 약속 1번: 서버가 세트 A·B 중 하나를 무작위로 골라 4문제를 준다
    const d = await post("/api/start", base());
    Object.assign(S, { anon: d.anon_id, round: 1, phase: "pre", cards: d.scenarios, idx: 0 });
    intro();
  });
}

/* =====================================================================
   2. 문자·메일 4개 (사전과 사후가 같은 화면)
   ===================================================================== */
function intro() {
  // 참고: 팀 결정 5번. 시작 안내에는 정답 힌트("보낸 곳을 보세요" 등)를 넣지 않는다
  const pre = S.phase === "pre";
  const day = S.mode === "org" ? "평소 업무 중에" : "평소처럼 하루를 보내다";
  render(`
    ${pre ? backBtn("사전질문") : ""}
    <p class="step">${modeName()} 체험 · ${phaseName()}</p>
    <h1 class="title">${pre ? "문자와 메일 4개가 도착해요" : "새 문자와 메일 4개가 도착해요"}</h1>
    <p class="lead">${pre ? `${day} 받은 메시지라고 생각하고, 어떻게 할지 골라 주세요.` : "처음 보는 메시지예요. 배운 대로 골라 보세요."}</p>
    <p class="note">문자 ${LIMIT.sms}초, 메일 ${LIMIT.email}초 제한이 있어요. 시간이 지나도 고를 수 있어요.</p>
    <div class="row"><button class="btn" id="next">시작하기</button></div>`, pre ? 1 : 5);
  if (pre) $("back").onclick = survey;   // 참고: 아직 답한 문제가 없어 기록이 남지 않는다. 다시 시작하면 새 익명 번호를 받는다
  $("next").onclick = message;
}

function smsParts(c) {
  const [name, num] = (c.sender || "").split(" / ");
  return { name, head: num || name };
}
function smsHTML(c, time, bubbles) {
  const { head } = smsParts(c);
  const link = c.link ? `<br><span class="lnk">${esc(c.link)}</span>` : "";
  const thread = bubbles || `<p class="day">오늘</p><div class="bubble-row"><div class="bubble">${esc(c.body)}${link}</div><time>${time}</time></div>`;
  return `<div class="sms" role="group" aria-label="휴대폰으로 받은 문자">
    <div class="sms-top"><span class="back" aria-hidden="true">‹</span><span class="avatar" aria-hidden="true">?</span>
      <span class="who">${esc(head)}<small>저장되지 않은 번호</small></span></div>
    <div class="sms-thread">${thread}</div>
    <div class="sms-input" aria-hidden="true"><span>＋</span><span class="box">문자 메시지</span></div>
  </div>`;
}
// 하는 일: 메일 보낸 사람을 "표시 이름"과 "주소"로 나눈다
// 참고: 새 카드(B 11/16)는 sender에 이름만, from에 "이름 <주소>". 예전 카드는 sender에 "이름 <주소>"
function mailParts(c) {
  const name = (c.sender || "").split("<")[0].trim();
  const src = c.from || c.sender || "";
  const m = src.match(/<([^>]+)>/);
  return { name, addr: m ? m[1] : (src.includes("@") ? src.trim() : "") };
}
function mailHTML(c, time, open) {
  // 하는 일: 처음엔 받은편지함 목록. 메일을 누르면 열리고, 표시 이름을 누르면 보낸 주소와 답장 주소가 펼쳐진다
  const { name, addr } = mailParts(c);
  const old = OLD_MAIL[S.mode].map(([n, s, t]) => `<div class="mail-row old" aria-disabled="true"><span class="dot"></span><span class="nm">${n}</span><time>${t}</time><span class="sj">${s}</span></div>`).join("");
  const link = c.link ? `\n\n<span class="lnk">${esc(c.link)}</span>` : "";
  return `<div class="mail-wrap"><div class="mail" id="mail" data-view="${open ? "read" : "list"}" role="group" aria-label="메일 앱">
    <div class="mail-bar"><span>받은편지함</span><span class="search">메일 검색</span></div>
    <div class="mail-body">
      <div class="mail-list">
        <button class="mail-row ${open ? "on" : "new"}" id="openMail"><span class="dot" aria-hidden="true"></span><span class="nm">${esc(name)}</span><time>${time}</time><span class="sj">${esc(c.subject)}</span>${open ? "" : `<span class="tap-me" aria-hidden="true">눌러서 열기</span>`}</button>
        ${old}
      </div>
      <div class="mail-read">
        <p class="empty-read">← 왼쪽 새 메일을 눌러 열어 보세요</p>
        <button class="back" id="backList">‹ 받은편지함</button>
        <h3>${esc(c.subject)}</h3>
        <div class="from"><span class="avatar" aria-hidden="true">${esc(name.charAt(0))}</span>
          <div class="meta"><button class="from-name" id="fromBtn" aria-expanded="${open ? "true" : "false"}" aria-controls="fromDetail">${esc(name)}</button>
            <span class="to">받는 사람: 나</span>
            <dl class="from-detail" id="fromDetail" ${open ? "" : "hidden"}>
              <dt>보낸 사람</dt><dd class="addr">${esc(addr || "주소 없음")}</dd>
              ${c.reply_to ? `<dt>답장 주소</dt><dd class="reply">${esc(c.reply_to)}</dd>` : ""}
              <dt>받는 사람</dt><dd>나</dd></dl></div>
          <time>${time}</time></div>
        <div class="mail-text">${esc(c.body)}${link}</div>
        ${c.attachment ? `<div class="attach"><i aria-hidden="true"></i><span><b>${esc(c.attachment)}</b><br>첨부파일 1개</span></div>` : ""}
      </div>
    </div></div></div>`;
}
function cardHTML(c, open) {
  const t = TIMES[S.idx % TIMES.length];
  return c.channel === "email" ? mailHTML(c, t, open) : smsHTML(c, t);
}

// 하는 일: 메시지에 없는 수단의 선택지는 같은 뜻의 행동으로 바꾼다 (팀 결정 6번, 예전 game.html 그대로)
const PHONE_RE = /\d{2,3}-\d{3,4}-\d{4}/;
const noPhone = c => !PHONE_RE.test(`${c.sender || ""} ${c.body || ""}`);
const noOpen = c => !c.link && !c.attachment;
function choiceLabel(c, k) {
  const own = c && c.choice_labels && c.choice_labels[k];
  const where = c && c.channel === "email" ? "메일" : "문자";
  if (k === "call" && c && noPhone(c)) return own && !/전화|번호/.test(own) ? own : `${where}에 답장해 물어본다`;
  if (k === "click" && c && noOpen(c)) return own && !/주소|링크|첨부|열어/.test(own) ? own : `${where} 안내대로 바로 처리한다`;
  return own || DEFAULT_LABELS[k];
}

function message() {
  const c = S.cards[S.idx];
  const keys = shuffle(["click", "call", "official"]);   // 하는 일: 보이는 순서만 섞는다. 서버로 보내는 값은 그대로 (흐름 문서 6번)
  const isMail = c.channel === "email";
  render(`
    <p class="step">${phaseName()} · ${S.idx + 1} / ${S.cards.length}</p>
    <div class="stage" id="stage">
      ${cardHTML(c, false)}
      <aside class="choices" aria-label="행동 고르기">
        <h2>이 메시지, 어떻게 할까요?</h2>
        <div class="timer" id="tbar"><i></i></div><p class="timer-txt" id="ttxt"></p>
        ${isMail ? `<p class="wait-open" id="waitOpen"><span class="left">← 왼쪽</span><span class="up">↑ 위</span> 받은편지함에서 새 메일을 눌러 열면 고를 수 있어요</p>` : ""}
        ${keys.map(k => `<button class="opt" data-k="${k}" ${isMail ? "disabled" : ""}>${esc(choiceLabel(c, k))}</button>`).join("")}
        <div id="msgErr"></div>
      </aside>
    </div>`, S.phase === "pre" ? 1 : 5);
  if (isMail) {
    const mail = $("mail");
    $("openMail").onclick = () => {
      mail.dataset.view = "read"; $("openMail").classList.add("on"); $("openMail").classList.remove("new");
      main.querySelectorAll(".opt").forEach(b => b.disabled = false); $("waitOpen").hidden = true;
    };
    $("backList").onclick = () => mail.dataset.view = "list";
    $("fromBtn").onclick = e => { const open = e.currentTarget.getAttribute("aria-expanded") === "true";
      e.currentTarget.setAttribute("aria-expanded", String(!open)); $("fromDetail").hidden = open; };
  }
  startTimer(LIMIT[c.channel] || LIMIT.sms);
  main.querySelectorAll(".opt").forEach(b => b.onclick = () => pickAction(c, b.dataset.k));
}

function startTimer(sec) {
  let left = sec; const bar = $("tbar"), txt = $("ttxt");
  S.over = false;
  const draw = () => { bar.firstElementChild.style.width = Math.max(0, left / sec * 100) + "%";
    txt.textContent = left > 0 ? `남은 시간 ${left}초` : "시간이 지났어요. 그래도 고를 수 있어요"; bar.classList.toggle("over", left <= 0); };
  draw(); timer = setInterval(() => { left--; draw(); if (left <= 0) { S.over = true; clearInterval(timer); } }, 1000);
}

function previewText(c, k) {
  const num = (`${c.sender || ""} ${c.body || ""}`.match(PHONE_RE) || [])[0];
  if (k === "click") {
    if (c.attachment) return ["첨부 파일을 여는 중이에요", false];
    if (c.link) return ["링크로 이동하는 중이에요", false];
    return ["안내대로 처리하는 중이에요", false];
  }
  if (k === "call") return [num ? `${num}로 전화를 거는 중이에요` : "답장을 보내는 중이에요", false];
  return ["따로 확인하는 중이에요", true];
}

async function pickAction(c, k) {
  clearInterval(timer);
  main.querySelectorAll(".opt").forEach(b => b.disabled = true);
  // 참고: 서버 오류로 다시 누를 때 두 번 세지 않도록 문제마다 한 번만 센다
  if (S.over && !c.lateCounted) { S.late[S.phase]++; c.lateCounted = true; }
  const [st, wait] = previewText(c, k);
  const pv = document.createElement("div");
  pv.className = "preview";
  pv.innerHTML = `<div class="box" role="status"><p class="lbl">내가 고른 행동</p><p class="ch">${esc(choiceLabel(c, k))}</p>
    <p class="st ${wait ? "wait" : ""}">${esc(st)}</p>${wait ? `<p class="note">그동안 ${S.mode === "org" ? "업무가" : "할 일이"} 미뤄지고 있어요</p>` : ""}<div class="bar"><i></i></div></div>`;
  $("stage").appendChild(pv);
  try {
    // 서버 약속 2번: 채점은 서버가 한다. 미리보기를 보여 주는 동안 함께 기다린다
    const [r] = await Promise.all([
      post("/api/answer", { ...base(), anon_id: S.anon, scenario_id: c.scenario_id, choice: k, round: S.round }),
      sleep(reduced() ? 600 : PREVIEW_MS)]);
    S.answers[S.phase][S.idx] = { scenario_id: c.scenario_id, choice: k };
    const harm = fullyFooled(r) ? harmOf(c, k, r) : null;
    addLog(c, r, choiceLabel(c, k), harm);
    explain(c, r, harm, choiceLabel(c, k));
  } catch (err) {
    pv.remove();
    main.querySelectorAll(".opt").forEach(b => b.disabled = false);
    $("msgErr").innerHTML = `<p class="error" role="alert">${esc(err.message)}</p>`;
  }
}

/* ----- 해설 (예전 game.html의 형광펜·실제였다면·자세히 보기를 그대로 가져옴) ----- */
const fullyFooled = r => r.is_phishing && !r.is_correct && !(r.stopped_step === 2 || r.stopped_step === 3);
// 하는 일: 피싱에 속었을 때 "실제였다면 일어났을 피해" (카드의 consequence가 먼저, A 11/02)
function harmOf(c, choice, r) {
  if (r.consequence && r.consequence.title) return r.consequence;
  const org = S.mode === "org";
  if (choice === "call" && noPhone(c)) return { title: "답장이 공격자에게 전달됐어요", detail: "보낸 주소와 답장 주소는 공격자가 정한 곳이에요. 이어진 대화에서 개인정보나 송금을 요구해요." };
  if (choice === "click" && noOpen(c)) return { title: "공격자가 시킨 대로 처리했어요", detail: "메시지가 요구한 처리(송금, 정보 전달)가 그대로 공격자에게 가요." };
  if (choice === "call") return { title: "사기범과 통화가 연결됐어요", detail: `상대는 ${org ? "기관이나 회사 직원" : "기관이나 학교 직원"}처럼 말하며 개인정보, 인증번호, 송금을 요구해요.` };
  if (r.stopped_step === 0) return { title: "휴대폰 정보가 빠져나가고 있어요", detail: "설치한 가짜 앱이 문자, 화면, 저장된 정보를 몰래 보내요." };
  if (c.attachment) return { title: `${org ? "회사 PC" : "내 컴퓨터"}에서 악성 프로그램이 실행됐어요`, detail: `문서처럼 보인 '${c.attachment}'은 실제로는 프로그램이었어요.` };
  if (c.channel === "email") return { title: `${org ? "사내 " : ""}계정 비밀번호가 넘어갔어요`, detail: "가짜 로그인 화면에 입력한 아이디와 비밀번호가 공격자에게 전송돼요." };
  return { title: "개인정보가 넘어갔어요", detail: "가짜 사이트에 입력한 이름, 전화번호, 인증번호가 공격자에게 전송돼요." };
}
// 하는 일: 결과 화면 "내가 한 일"에 이번 문제를 한 줄 남긴다 (화면에만 쓰고 서버로 보내지 않음)
function addLog(c, r, did, harm) {
  const tag = ((c.body || "").match(/^\[([^\]]+)\]/) || [])[1];   // 문자 맨 앞 [보낸 곳] (번호만 있는 문자도 무슨 문자였는지 알 수 있게)
  const what = c.channel === "email" ? (c.subject || "메일") : `${tag || smsParts(c).name} 문자`;
  const kind = r.is_correct ? (r.over_suspicion ? "slow" : "ok") : "bad";
  S.log[S.phase][S.idx] = { what, did, kind, phishing: r.is_phishing, harm: harm ? harm.title : "", call: did && c.choice_labels && did === choiceLabel(c, "call") };
}

// 하는 일: 해설 화면 왼쪽 메시지 위에 단서 위치를 형광펜과 번호로 표시한다 (A 11/02, 새 화면 틀에 맞춰 이름표만 바꿈)
function annotate(root, clues, phishing) {
  const pin = n => { const p = document.createElement("span"); p.className = "pin" + (phishing ? "" : " safe"); p.textContent = n; p.setAttribute("aria-hidden", "true"); return p; };
  const box = (el, n) => { if (!el) return false; el.classList.add("clue-wrap"); if (!phishing) el.classList.add("safe"); el.appendChild(pin(n)); return true; };
  const body = root.querySelector(".mail-text, .bubble");
  const markWord = (word, n) => {
    if (!body || !word) return false;
    const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, { acceptNode: t => t.parentElement.closest(".lnk, mark") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    let t;
    while ((t = walk.nextNode())) {
      const i = t.data.indexOf(word); if (i < 0) continue;
      const m = document.createElement("mark"); m.className = "clue";
      const rest = t.splitText(i); rest.splitText(word.length);
      rest.parentNode.replaceChild(m, rest); m.textContent = word; m.after(pin(n));
      return true;
    }
    return false;
  };
  const words = text => (text.match(/"([^"]+)"/g) || []).map(w => w.slice(1, -1));
  (clues || []).forEach((c, k) => {
    const n = k + 1, f = c.factor || "", tx = c.text || "";
    const ws = words(tx);
    if (ws.length) {
      let done = false;
      ws.forEach(w => { if (markWord(w, n)) done = true; else if (!done) { const last = w.split(" ").pop(); if (last.length >= 2) done = markWord(last, n); } });
      if (done) return;
    }
    const ASK = [[/설치/, ["앱을 설치", "설치"]], [/재로그인|로그인 유도/, ["재로그인", "본인 확인"]], [/계좌/, ["새 계좌로 보내", "새 계좌"]],
      [/비밀번호를 묻지/, ["비밀번호를 회신하실 필요는 없습니다"]], [/공식 경로/, ["[내 정보 > 비밀번호 변경]"]],
      [/지원금|미끼/, ["[정부24] 민생 지원금", "지원금"]], [/링크 없이도/, ["사내 포털에서 볼 수 있습니다"]]];
    const ask = ASK.find(([re]) => re.test(f));
    if (ask && ask[1].some(w => markWord(w, n))) return;
    if (/확장자|첨부/.test(f)) { box(root.querySelector(".attach"), n); return; }
    if (/답장/.test(f)) { box(root.querySelector(".from-detail .reply"), n); return; }   // 새 화면은 답장 주소가 보여서 표시한다
    if (/발신|보낸 주소|기관 사칭|회사 번호|주소만으로|표시 이름/.test(f)) { box(root.querySelector(".from-detail .addr") || root.querySelector(".sms-top .who"), n); return; }
    if (/전화/.test(f) && body) { const m = (body.textContent.match(PHONE_RE) || [])[0]; if (m && markWord(m, n)) return; }
    if (/주소|도메인|링크|로그인|설치|경로/.test(f)) { box(root.querySelector(".lnk"), n); return; }
  });
}

function engineHTML(r) {
  const a = r.analysis;
  if (!a) return `<p class="muted">이 메시지는 탐지 엔진으로 분석할 링크나 메일 정보가 없어요.</p>`;
  let h = `<p class="score-line">${a.type === "email" ? "메일" : "링크"} 위험 점수 <b>${a.score}</b> / 100</p>`;
  if (a.reasons.length) h += `<ul class="list">${a.reasons.map(x => `<li><div><span class="factor">${esc(x.factor)}</span><span class="text">${esc(x.text)}</span></div><span class="pts">+${x.points}</span></li>`).join("")}</ul>`;
  else h += `<p class="muted">위험 신호를 찾지 못했어요.</p>`;
  if (a.unavailable.length) h += `<p class="note">확인하지 못한 항목: ${a.unavailable.map(u => esc(UNAVAILABLE[u] || u)).join(", ")}</p>`;
  // AI 모델 확률: 60% 이상만 숫자, 아래는 "구별하기 어려워요" (A 10/29 결정)
  if (typeof a.model_probability === "number") h += a.model_probability >= 0.6
    ? `<p class="score-line">AI 판단: 주소 모양이 피싱과 비슷해요 (${Math.round(a.model_probability * 100)}%)</p>`
    : `<p class="score-line">AI 판단: 주소 모양만으로는 구별하기 어려워요</p>`;
  if (r.text_clues && r.text_clues.length) h += `<p class="score-line">문자 본문에서 찾은 압박 문구: <b>${r.text_clues.map(w => "'" + esc(w) + "'").join(", ")}</b></p><p class="note">위 링크 점수에는 들어가지 않아요.</p>`;
  if (r.is_phishing && a.score < 30) h += `<p class="note">탐지 점수가 낮아도 피싱일 수 있어요. 공격자가 진짜처럼 꾸민 주소로 보내면 기계 검사를 통과하기도 해요. 그래서 위의 수상한 점을 사람이 직접 확인하는 게 중요해요.</p>`;
  return h;
}

function explain(c, r, harm, did) {
  // 하는 일: 맨 위 큰 띠 하나로 "피싱이었는지, 내가 막았는지"를 먼저 보여 준다 (A 11/20: 한눈에 안 보임)
  let v;
  if (r.is_phishing) v = r.is_correct ? ["good", "✓", "피싱을 막았어요!", "이 메시지는 피싱이었어요"] : ["bad", "✕", "속았어요", "이 메시지는 피싱이었어요"];
  else v = r.over_suspicion ? ["wait", "△", "정상 메시지였어요", `확인하느라 ${S.mode === "org" ? "업무가" : "할 일이"} 늦어졌어요`] : ["good", "✓", "잘 처리했어요", "이 메시지는 정상이었어요"];
  const last = S.idx === S.cards.length - 1;
  render(`
    <p class="step">${phaseName()} · 문제 ${S.idx + 1}번 결과</p>
    <div class="verdict-big ${v[0]}" role="status"><span class="ico" aria-hidden="true">${v[1]}</span><div><b>${v[2]}</b><span class="sub">${v[3]}${did ? ` · 내 선택: ${esc(did)}` : ""}</span></div></div>
    <div class="explain">
      <div id="exCard">${cardHTML(c, true)}</div>
      <div>
        <div class="ex-box">
          ${harm ? `<p class="harm-now"><b>실제였다면:</b> ${esc(harm.title)}. ${esc(harm.detail || "")}</p>` : ""}
          <p class="short">${esc(r.explanation_short || r.explanation)}</p>
          <h3>${r.is_phishing ? "수상한 점" : "확인한 점"} <small class="muted" style="font-weight:400;font-size:.8rem">(메시지에 번호로 표시)</small></h3>
          <ul class="list">${(r.clues || []).map((x, k) => `<li><div><span class="factor"><span class="pin${r.is_phishing ? "" : " safe"}" aria-hidden="true">${k + 1}</span>${esc(x.factor)}</span><span class="text">${esc(x.text)}</span></div></li>`).join("")}</ul>
          <details class="detail"><summary>자세히 보기 (해설 전체, 탐지 엔진 분석)</summary>
            <h4>해설</h4><p>${esc(r.explanation)}</p>
            <h4>탐지 엔진 분석</h4>${engineHTML(r)}
          </details>
        </div>
      </div>
    </div>
    <div class="row"><button class="btn" id="next">${last ? "다음" : "다음 메시지"}</button></div>`, S.phase === "pre" ? 2 : 5);
  annotate($("exCard"), r.clues, r.is_phishing);
  $("next").onclick = () => { if (!last) { S.idx++; message(); } else afterPhase($("next")); };
}

/* =====================================================================
   3. 사전이 끝난 뒤: 기관용 따라 쓰기 → 연쇄형 / 개인용 연쇄형 → 게임
   ===================================================================== */
function afterPhase(btn) {
  busy(btn, async () => {
    // 서버 약속 3번: 이번 단계 답을 보내 서버가 다시 채점한 결과를 받는다
    const r = await post("/api/result", { ...base(), anon_id: S.anon, answers: S.answers[S.phase] });
    S.res[S.phase] = r;
    if (S.phase === "post") return result();
    S.mode === "org" ? copyLine() : practice();
  });
}

function pickCopyLine(r) {
  if (S.log.pre.some(l => l && l.kind === "bad" && l.call)) return COPY_LINES.call;
  const t = (r.weak_types || []).find(x => COPY_LINES[x]);
  if (t) return COPY_LINES[t];
  if (r.over_suspicion > 0) return COPY_LINES.over;
  return COPY_LINES.all;
}
function copyLine() {
  // 하는 일: 사전 체험 결과에 맞는 대응 매뉴얼 문장을 직접 따라 쓴다 (기관용, 팀 결정 8번). 붙여 넣기는 막는다
  const line = pickCopyLine(S.res.pre);
  const bare = t => (t || "").replace(/[\s.,!?·'"‘’“”…~-]/g, "");
  render(`
    <p class="step">기관용 체험 · 배우기</p>
    <h1 class="title">대응 매뉴얼 문장을 따라 써 보세요</h1>
    <p class="lead">방금 체험 결과에 맞는 문장이에요. 직접 읽고 쓰면 오래 기억에 남아요.</p>
    <p class="copy-src">${esc(line)}</p>
    <textarea class="field copy-in" id="copy" rows="3" style="max-width:40rem;margin-top:.8rem;resize:vertical" aria-label="따라 쓰기"></textarea>
    <p class="copy-msg" id="copyMsg" role="status"></p>
    <div class="row"><button class="btn" id="next" disabled>다음</button></div>`, 3);
  const t = $("copy");
  t.onpaste = e => { e.preventDefault(); $("copyMsg").classList.remove("ok"); $("copyMsg").textContent = "붙여 넣기 대신 직접 입력해 주세요."; };
  const check = () => { const ok = bare(t.value) === bare(line); t.classList.toggle("ok", ok); $("copyMsg").classList.toggle("ok", ok);
    $("copyMsg").textContent = ok ? "잘 입력했어요." : ""; $("next").disabled = !ok; };
  t.oninput = check; t.addEventListener("compositionend", check);
  $("next").onclick = practice;
}

/* ----- 연쇄형 연습 (서버 약속 9번, 점수에 안 들어감) ----- */
async function practice() {
  const cn = S.mode === "org" ? 4 : 3;
  render(`<p class="step">연습 · 연쇄형 체험</p><p class="lead">문자를 불러오는 중이에요.</p>`, cn);
  try {
    const d = await post("/api/practice", {});
    S.chainCard = d.scenarios[0]; S.chainSteps = []; S.chainResult = null;
    chainScreen();
  } catch (err) {
    render(`<p class="step">연습 · 연쇄형 체험</p><p class="error" role="alert">${esc(err.message)}</p>
      <div class="row"><button class="btn" id="again">다시 불러오기</button></div>`, cn);
    $("again").onclick = practice;
  }
}
function chainThread() {
  const c = S.chainCard;
  const link = c.link ? `<br><span class="lnk">${esc(c.link)}</span>` : "";
  let h = `<p class="day">오늘</p><div class="bubble-row"><div class="bubble">${esc(c.body)}${link}</div><time>오후 2:14</time></div>`;
  S.chainSteps.forEach(st => { h += `<p class="day">${esc(st.title)}</p><div class="bubble-row"><div class="bubble">${esc(st.body)}</div><time>오후 3:02</time></div>`; });
  return h;
}
function chainScreen() {
  const c = S.chainCard, st = S.chainSteps[S.chainSteps.length - 1];
  const step = st ? st.step : 1;
  const opts = st ? shuffle([["continue", st.continue_label], ["stop", st.stop_label]]) : shuffle(["click", "call", "official"]).map(k => [k, choiceLabel(c, k)]);
  render(`
    <p class="step">연습 · 연쇄형 체험 ${step}단계 <span class="data-tag">점수에 안 들어가요</span></p>
    <div class="stage">
      ${smsHTML(c, "", chainThread())}
      <aside class="choices" aria-label="행동 고르기"><h2>${st ? "이어서 어떻게 할까요?" : "이 문자, 어떻게 할까요?"}</h2>
        ${opts.map(([k, t]) => `<button class="opt" data-k="${k}">${esc(t)}</button>`).join("")}
        <div id="msgErr"></div></aside>
    </div>`, S.mode === "org" ? 4 : 3);
  const btns = main.querySelectorAll(".opt");
  // 하는 일: 새 단계가 뜬 뒤 0.8초 동안 버튼을 잠근다 (읽지도 않고 연달아 누르는 것을 막으려고, 예전 game.html)
  if (st) { btns.forEach(b => b.disabled = true); setTimeout(() => btns.forEach(b => b.disabled = false), 800); }
  btns.forEach(b => b.onclick = async () => {
    btns.forEach(x => x.disabled = true);
    try {
      const r = st
        ? await post("/api/chain", { ...base(), anon_id: S.anon, scenario_id: c.scenario_id, step: st.step, action: b.dataset.k })
        : await post("/api/answer", { ...base(), anon_id: S.anon, scenario_id: c.scenario_id, choice: b.dataset.k, chain: true });
      if (r.chain_step) { S.chainSteps.push(r.chain_step); return chainScreen(); }
      S.chainResult = { step: r.stopped_step, call: !st && b.dataset.k === "call", titles: r.chain_titles };
      chainDone(r);
    } catch (err) {
      btns.forEach(x => x.disabled = false);
      $("msgErr").innerHTML = `<p class="error" role="alert">${esc(err.message)}</p>`;
    }
  });
}
function chainLine(cr) {
  // 하는 일: 어디서 멈췄는지를 한 줄로 (단계 이름은 카드의 단계 제목에서 가져온다)
  const t = cr.titles || [];
  if (cr.step === 1) return "첫 문자에서 멈추고 따로 확인했어요.";
  if (cr.step >= 2) return `'${t[cr.step - 2] || cr.step + "단계"}'에서 멈췄어요.`;
  return cr.call ? "문자에 적힌 번호로 전화했어요." : "마지막 단계까지 따라갔어요.";
}
function chainDone(r) {
  const cr = S.chainResult;
  const harm = cr.step === 0 ? harmOf(S.chainCard, cr.call ? "call" : "click", r) : null;
  render(`
    <p class="step">연습 · 연쇄형 체험 결과 <span class="data-tag">점수에 안 들어가요</span></p>
    <h1 class="title">${esc(chainLine(cr))}</h1>
    <p class="chain-steps">${esc(["첫 문자", ...(cr.titles || [])].join(" → "))}</p>
    <div class="ex-box" style="margin-top:1.2rem;max-width:44rem">
      ${harm ? `<p class="harm-now"><b>실제였다면:</b> ${esc(harm.title)}. ${esc(harm.detail || "")}</p>` : ""}
      <p class="short">${esc(r.explanation_short)}</p>
      <p>${esc(r.explanation)}</p>
    </div>
    <div class="row"><button class="btn" id="next">${S.mode === "personal" ? "게임으로 훈련하기" : "사후 체험 시작"}</button></div>`, S.mode === "org" ? 4 : 3);
  $("next").onclick = () => S.mode === "personal" ? game() : beginPost($("next"));
}

/* ----- 개인용 게임: 위험한 행동만 골라 누르기 (시간 제한 없음, 팀 결정 19번) ----- */
function game() {
  const cards = shuffle(ACTIONS);
  const total = cards.filter(a => a[1]).length;
  let found = 0;
  render(`
    <section class="game">
      <p class="step">개인용 체험 · 게임 훈련</p>
      <h1 class="title">위험한 행동만 골라 눌러요</h1>
      <p class="lead">시간 제한은 없어요. 위험한 행동을 다 찾으면 끝나요.</p>
      <div class="card game-top"><span class="peek"><svg viewBox="0 0 110 80" aria-hidden="true"><g transform="rotate(-5 50 40)"><rect x="5" y="8" width="84" height="60" rx="12" fill="#3B7BE0" stroke="#2B5FB8" stroke-width="3"/><path d="M11 16 L47 42 L83 16" fill="none" stroke="#DCE8FB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="48" r="7" fill="#fff" stroke="#2B5FB8" stroke-width="2"/><circle cx="58" cy="48" r="7" fill="#fff" stroke="#2B5FB8" stroke-width="2"/><circle cx="37" cy="50" r="3.3" fill="#0F1F45"/><circle cx="61" cy="50" r="3.3" fill="#0F1F45"/><path d="M26 38 l14 2" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/><path d="M52 37 q6 -6 13 -1" fill="none" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/><path d="M41 60 l10 -2" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/></g><line x1="92" y1="62" x2="83" y2="75" stroke="#2B5FB8" stroke-width="6" stroke-linecap="round"/><circle cx="96" cy="50" r="13" fill="#DCE8FB" fill-opacity=".6" stroke="#2B5FB8" stroke-width="4"/></svg></span><div class="gbar"><div class="lbl"><span>찾은 위험한 행동</span><span id="found" role="status">0 / ${total}</span></div><div class="track"><i id="gfill"></i></div></div></div>
      <div class="grid" id="grid">${cards.map((a, i) => `<button class="blk" data-i="${i}">${esc(a[0])}</button>`).join("")}</div>
    </section>`, 4);
  main.querySelectorAll(".blk").forEach(b => b.onclick = () => {
    if (b.dataset.done) return;
    const a = cards[b.dataset.i];
    if (a[1]) {
      b.dataset.done = 1; b.classList.add("ok"); found++;
      b.insertAdjacentHTML("beforeend", `<span class="bd">위험!</span><span class="why">${esc(a[2])}</span>`);
      $("found").textContent = `${found} / ${total}`; $("gfill").style.width = `${found / total * 100}%`;
      if (found === total) setTimeout(gameEnd, 900);
    } else {
      b.classList.remove("ng"); void b.offsetWidth; b.classList.add("ng");
      if (!b.querySelector(".why")) b.insertAdjacentHTML("beforeend", `<span class="why">안전한 행동이에요. ${esc(a[2])}</span>`);
    }
  });
}
function gameEnd() {
  render(`
    <p class="step">개인용 체험 · 게임 훈련 끝</p>
    <h1 class="title">위험한 행동을 모두 찾았어요</h1>
    <div class="card done-box"><svg viewBox="0 0 100 76" aria-hidden="true"><g transform="rotate(-7 50 40)"><rect x="5" y="8" width="90" height="62" rx="12" fill="#3B7BE0" stroke="#2B5FB8" stroke-width="3"/><path d="M11 16 L50 43 L89 16" fill="none" stroke="#DCE8FB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 51 q6 -6 12 0 M58 51 q6 -6 12 0" fill="none" stroke="#0F1F45" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="27" cy="59" rx="5" ry="3" fill="#F4A6B5"/><ellipse cx="73" cy="59" rx="5" ry="3" fill="#F4A6B5"/><path d="M44 58 q6 5 12 0" fill="none" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/></g></svg><p><b style="color:var(--navy)">기억할 한 가지</b><br>메시지가 알려 준 길(링크, 번호, 답장)이 아니라, 내가 직접 찾은 길로 확인해요.</p></div>
    <div class="row"><button class="btn" id="next">사후 체험 시작</button></div>`, 4);
  $("next").onclick = () => beginPost($("next"));
}

/* ----- 사후 체험: 모두, 처음과 반대 세트 (팀 결정 3·8번) ----- */
function beginPost(btn) {
  busy(btn, async () => {
    // 참고: 사전에 푼 카드 번호를 보내면 서버가 그 세트를 확인하고 반대 세트를 준다. 익명 번호는 그대로
    const d = await post("/api/start", { ...base(), retry: { anon_id: S.anon, answers: S.answers.pre } });
    Object.assign(S, { phase: "post", round: d.round || 2, cards: d.scenarios, idx: 0 });
    intro();
  });
}

/* =====================================================================
   4. 결과: 사전·사후 나란히
   ===================================================================== */
// 하는 일: 두 점수로 보안 대응 수준을 5단계로 정한다 (B 11/03·11/09, 예전 game.html 그대로)
const LEVELS = {
  5: { name: "우수", color: "var(--safe)", head: "보안 대응이 아주 안정적이에요",
       body: "피싱은 모두 멈추고, 진짜 {work}는 바로 처리하셨어요. 보낸 곳과 요구하는 행동을 보고 판단하는 습관이 잘 자리 잡혀 있어요. 이 기준을 {people}과도 나눠 주세요." },
  4: { name: "양호", color: "var(--accent)", head: "피싱은 모두 막으셨어요. 판단을 조금만 더 다듬어 보세요",
       body: "피싱은 모두 막으셨고, 진짜 {work} {stuck}건은 확인하느라 잠시 멈췄어요. 요구하는 행동이 안전한 메시지는 바로 처리하셔도 괜찮아요." },
  3: { name: "보통", color: "var(--caution)", head: "기본적인 대응은 잘하고 계세요. 몇 가지만 더 챙기면 좋아요",
       body: "피싱 {ptotal}개 중 {missed}개는 놓치셨어요. {risk} 아래 내용을 함께 살펴보시면 좋아요." },
  2: { name: "보완 권장", color: "var(--caution)", head: "몇 가지 대응 습관을 함께 보완해 보면 좋겠어요",
       body: "피싱 {ptotal}개 중 {missed}개는 놓치셨어요. 비슷한 메시지는 실제로도 자주 오니, 아래 내용을 한 번 확인해 보세요." },
  1: { name: "집중 연습 권장", color: "var(--danger)", head: "이번 체험을 계기로 대응 방법을 차근차근 익혀 보세요",
       body: "이번에는 피싱을 막지 못하셨어요. 처음에는 누구나 헷갈릴 수 있어요. 아래 내용을 확인하시면 다음에는 훨씬 쉽게 가려내실 수 있어요." }
};
const FIX = [[/기관|사칭/, "기관이나 회사 이름이 보여도 믿지 말고, 공식 앱이나 대표번호로 직접 확인하기"],
  [/도메인|주소/, "주소를 한 글자씩 읽고 진짜 주소와 비교하기"],
  [/압박|심리/, "'오늘 중', '불이익'처럼 서두르게 하는 말이 보이면 일단 멈추기"],
  [/연쇄/, "앱 설치나 정보 입력을 요구하면 첫 단계에서 멈추기"]];
function levelHTML(r) {
  const org = S.mode === "org";
  const pt = r.phishing_total, pb = r.phishing_blocked, missed = pt - pb, stuck = r.normal_total - r.normal_handled;
  const lv = missed === 0 ? (stuck === 0 ? 5 : 4) : pb === 0 ? 1 : pb / pt >= 0.5 ? 3 : 2;
  const L = LEVELS[lv], work = org ? "업무" : "메시지";
  let body = L.body.replace("{stuck}", stuck).replace("{ptotal}", pt).replace("{missed}", missed).replace("{work}", work)
    .replace("{people}", org ? "동료분들" : "주변 사람들")
    .replace("{risk}", org ? "실제 업무에서는 한 번의 클릭이 회사 계정이나 자료와 이어질 수 있어서," : "실제로는 한 번의 클릭이 계정이나 돈과 이어질 수 있어서,");
  if (lv <= 3 && stuck > 0) body += ` 진짜 ${work} ${stuck}건은 확인하느라 잠시 멈췄어요.`;
  const fixes = [];
  (r.weak_types || []).forEach(t => { const f = FIX.find(([re]) => re.test(t)); if (f && !fixes.includes(f[1])) fixes.push(f[1]); });
  if (missed > 0 && !fixes.length) fixes.push("돈·개인정보·로그인·앱 설치를 요구하면 시간이 걸려도 멈추고 확인하기");
  if (stuck > 0) fixes.push(`돈·개인정보·로그인·앱 설치를 요구하지 않는 ${org ? "평소 업무" : "평범한 메시지"}는 바로 처리하기`);
  const meter = [1, 2, 3, 4, 5].map(n => `<i class="${n <= lv ? "on" : ""}"></i>`).join("");
  return `<section class="level" style="--lv:${L.color}" aria-label="나의 보안 대응 수준 ${L.name}">
    <div class="lv-top"><span>나의 보안 대응 수준: <b>${L.name}</b></span><span class="lv-meter" aria-hidden="true">${meter}</span></div>
    <h2>${esc(L.head)}</h2><p>${esc(body)}</p>` +
    (fixes.length ? `<p><b>함께 살펴볼 부분</b></p><ul>${fixes.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "") +
    (org ? `<p class="lv-note">이 결과는 이름 없이 익명으로 모여, 회사가 직군별로 약한 부분을 찾아 다음 보안 교육에 반영하는 데 쓰여요.</p>` : "") + `</section>`;
}
// 하는 일: 사전과 비교해 칭찬 한 줄 + 다음 할 일 한 줄 (A 11/02·11/03, 예전 game.html). 칭찬은 실제 점수에서만 고른다
function againLine(pv, r) {
  const better = r.phishing_blocked > pv.phishing_blocked || r.normal_handled > pv.normal_handled;
  const worse = r.phishing_blocked < pv.phishing_blocked || r.normal_handled < pv.normal_handled;
  const work = S.mode === "org" ? "업무" : "메시지";
  const allOk = r.phishing_blocked === r.phishing_total && r.normal_handled === r.normal_total;
  const good = r.phishing_blocked > 0 ? `처음 보는 피싱 ${r.phishing_blocked}개를 막아 냈어요.`
             : r.normal_handled > 0 ? `진짜 ${work} ${r.normal_handled}개는 망설이지 않고 처리했어요.` : "끝까지 두 번 체험한 것만으로도 큰 연습이 됐어요.";
  if (allOk) return [better ? "만점! 사전보다 확실히 나아졌어요." : "사후에도 만점이에요!", "처음 보는 문제에서도 배운 판단 기준을 그대로 썼어요. 실제로도 이렇게 멈추고 확인하면 돼요."];
  if (better && !worse) return [`사전보다 나아졌어요! ${good}`, "남은 문제는 아래 \"내가 한 일\"에서 한 번만 더 살펴보면 충분해요."];
  if (worse && !better) return [`이번 문제가 더 까다로웠나 봐요. 그래도 ${good}`, "새 수법은 누구에게나 어려워요. 속은 문제의 해설에서 번호 표시만 다시 봐 두면 다음엔 막을 수 있어요."];
  if (r.phishing_blocked > pv.phishing_blocked) return ["피싱은 사전보다 더 막았어요!", `다만 진짜 ${work}도 더 멈췄어요. 돈·개인정보·로그인·앱 설치를 요구하지 않으면 바로 처리해도 돼요.`];
  if (r.normal_handled > pv.normal_handled) return [`${work}는 사전보다 빠르게 처리했어요!`, "다만 피싱을 더 놓쳤어요. 돈·개인정보·로그인·앱 설치를 요구하면 멈추고 따로 확인하세요."];
  return [`사전과 같은 결과예요. ${good}`, "처음 보는 문제라 쉽지 않았을 거예요. 속은 문제의 해설에서 번호 표시만 다시 봐 두세요."];
}

function result() {
  const a = S.res.pre, b = S.res.post;
  const row = (lbl, n, t, cls) => `<div class="pp ${cls}"><span>${lbl}</span><span class="track"><i style="width:${t ? n / t * 100 : 0}%"></i></span><b>${n}/${t}</b></div>`;
  const [head, tip] = againLine(a, b);
  const work = S.mode === "org" ? "업무" : "메시지";
  const harms = [...S.log.pre, ...S.log.post].filter(l => l && l.harm).map(l => l.harm);
  const logs = [["사전", S.log.pre], ["사후", S.log.post]];
  const late = S.late.pre + S.late.post, all = S.answers.pre.length + S.answers.post.length;
  const jc = S.mode === "org" ? a.job_compare : null;   // 같은 직군 비교는 사전(1회차) 기준 (관리자 통계와 같은 기준)
  let side = levelHTML(b);
  if (harms.length) side += `<div class="harm" role="note"><b>실제였다면 이런 일이 일어났어요</b><ul>${harms.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>`;
  if (b.over_suspicion > 0) side += `<p class="slow-box">사후 체험에서 확인하느라 ${work}가 ${b.over_suspicion}번 늦어졌어요. 보낸 곳과 요구하는 행동(돈·개인정보·로그인·앱 설치)을 먼저 보고, 그래도 애매할 때 확인하세요.</p>`;
  render(`
    <p class="step">${modeName()} 체험 · 결과</p>
    <h1 class="title">체험을 모두 마쳤어요</h1>
    <p class="headline">${esc(head)}</p><p class="muted">${esc(tip)}</p>
    <div class="result">
      <div>
        <section class="score"><h3>막은 피싱</h3><p>피싱을 잘 멈췄나요?</p>
          ${row("사전", a.phishing_blocked, a.phishing_total, "pre")}${row("사후", b.phishing_blocked, b.phishing_total, "post")}</section>
        <section class="score"><h3>처리한 업무</h3><p>정상 메시지까지 의심하지 않고 잘 처리했나요?</p>
          ${row("사전", a.normal_handled, a.normal_total, "pre")}${row("사후", b.normal_handled, b.normal_total, "post")}</section>
      </div>
      <div style="display:grid;gap:1.2rem">${side}</div>
    </div>
    <h2 class="sub-h">내가 한 일</h2>
    ${logs.map(([n, list]) => `<p class="log-h">${n} 체험</p><ul class="mylog">${list.filter(Boolean).map(l => {
      const [m, t] = l.kind === "ok" ? ["✓", l.phishing ? "막았어요" : "바로 처리했어요"] : l.kind === "slow" ? ["△", `정상인데 멈춰서 ${work === "업무" ? "업무가" : "할 일이"} 늦어졌어요`] : ["✕", "속았어요"];
      return `<li><span class="mark ${l.kind}" aria-hidden="true">${m}</span><div>${esc(l.what)}<small>내 선택: ${esc(l.did)} · ${t}</small>${l.harm ? `<small class="harm-line">→ ${esc(l.harm)}</small>` : ""}</div></li>`;
    }).join("")}</ul>`).join("")}
    ${jc && typeof jc.avg === "number" && typeof jc.mine === "number" ? (() => {
      const avg = Math.round(jc.avg * 100), mine = Math.round(jc.mine * 100);
      const bar = (label, v, me) => `<div class="cmp-row${me ? " me" : ""}"><span>${label}</span><span class="track"><i class="fill" style="width:${Math.max(v, 1)}%"></i></span><span class="val">${v}%</span></div>`;
      return `<h2 class="sub-h">같은 직군과 비교한 오답률 (사전 체험)</h2><div class="cmp" role="img" aria-label="같은 직군 평균 오답률 ${avg}%, 내 오답률 ${mine}%">${bar("같은 직군 평균", avg, false)}${bar("나", mine, true)}</div>
        <p class="muted" style="font-size:.88rem;margin-top:.4rem">${mine < avg ? "같은 직군 평균보다 덜 속았어요." : mine > avg ? "같은 직군 평균보다 더 속았어요." : "같은 직군 평균과 같아요."}</p>`;
    })() : ""}
    ${(b.tips || []).length ? `<h2 class="sub-h">이렇게 해 보세요</h2><ul class="list">${b.tips.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ul>` : ""}
    <details class="detail" style="margin-top:1.2rem"><summary>자세히 보기</summary>
      <p>${esc(a.gap_message)}</p>
      <p class="muted">자신감 ${a.confidence}점 (사전질문)</p>
      <p class="muted">제한 시간(문자 ${LIMIT.sms}초, 메일 ${LIMIT.email}초) 안에 고른 문제 ${all - late}/${all}</p>
      ${S.chainResult ? `<p>연쇄형 연습: ${esc(chainLine(S.chainResult))}</p>` : ""}
      <p class="note">익명 번호 ${esc(S.anon)}</p>
    </details>
    <div class="more"><span>더 알아보기:</span>
      <a href="/check" target="_blank" rel="noopener">링크 검사</a>
      <a href="/manual" target="_blank" rel="noopener">대응 매뉴얼</a></div>
    <div class="row"><a class="btn sub" href="/">처음으로</a></div>`, 6);
}

/* =====================================================================
   메뉴, 시작
   ===================================================================== */
const side = $("side"), menuBtn = $("menuBtn");
const setMenu = open => { side.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); };
menuBtn.onclick = () => setMenu(!side.classList.contains("open"));
document.addEventListener("click", e => { if (side.classList.contains("open") && !side.contains(e.target) && e.target !== menuBtn) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

// 하는 일: 주소 끝 꼬리표로 어느 체험인지 정한다 (흐름 문서 6번: game?mode=personal / game?mode=org). 없으면 고르기 화면
const qm = new URLSearchParams(location.search).get("mode");
["personal", "org"].includes(qm) ? start(qm) : choose();
</script>
</body>
</html>
