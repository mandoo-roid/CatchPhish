<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐치피싱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --ink: #1B2A41; --muted: #5B6B7D; --paper: #FFFFFF; --field: #F1F4F7; --line: #D5DDE3; --focus: #2457C5;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --ink: #E6ECF2; --muted: #9AA8B6; --paper: #12181F; --field: #1C242D; --line: #2E3A46; --focus: #8DB2FF; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem; min-height: 100vh; display: flex; flex-direction: column; }
.brand { font-size: .9rem; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin: 0 0 2.5rem; }
h1 { font-size: 2rem; line-height: 1.3; margin: 0 0 .75rem; letter-spacing: -0.01em; }
.lead { color: var(--muted); margin: 0 0 2.5rem; }
.go { display: block; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: .75rem; }
.go.main { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.go b { display: block; font-size: 1.1rem; }
.go span { font-size: .9rem; opacity: .8; }
.go:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
footer { margin-top: auto; padding-top: 3rem; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">캐치피싱 CatchPhish</p>
  <h1>오늘 받은 그 메일,<br>진짜였을까요?</h1>
  <p class="lead">회사로 오는 피싱 메일·문자를 직접 겪어 보고, 왜 위험한지 AI 탐지 엔진의 해설로 확인하는 보안 교육 체험이에요.</p>

  <a class="go main" href="/game"><b>피싱 대응 체험 시작</b><span>메일·문자 5개, 약 5분</span></a>
  <a class="go" href="/check"><b>의심 링크 바로 검사</b><span>받은 링크를 붙여 넣으면 위험한 점을 알려 드려요</span></a>

  <footer>배화여자대학교 소프트웨어공학과 Phish&amp;Chips 캡스톤디자인</footer>
</main>
</body>
</html>
