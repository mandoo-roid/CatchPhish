<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐치피싱 링크 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 포스터 테마 (A 11/19, 포스터 2장 색·글꼴·카드 모양을 사이트에 옮김) =====
   색: 포스터 파일에서 뽑은 값 (A 개인 메모 5번). 글꼴: 제목 주아체(Jua), 본문 본고딕(Noto Sans KR), 둘 다 OFL (B 11/16)
   카드: 흰 바탕 + 남색 두꺼운 테두리 + 오른쪽 아래 진한 그림자 (포스터 "이런 걸 할 수 있어요" 카드) */
:root {
  color-scheme: light;
  --bg: #E7ECF4; --dot: #CBD5E5; --paper: #FFFFFF; --field: #F2F5FA; --line: #D3DCEA;
  --navy: #0F1F45; --ink: #1B2A41; --muted: #56657D; --blue: #2563C9; --blue-soft: #E3ECFA; --circle: #CFDCF0;
  --point: #FFE699; --mascot: #3B7BE0; --shadow: #B8C4D8;
  --danger: #C62828; --danger-soft: #FDECEC; --caution: #8A5A00; --caution-soft: #FFF3D1; --safe: #1E7A4E; --safe-soft: #E3F4EA;
  --title: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-card: 22px; --r-btn: 14px; --bw: 2.5px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; font-size: 17px; }
@media (min-width: 56rem) { html { font-size: 19px; } }
body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg) radial-gradient(var(--dot) 1.3px, transparent 1.5px) 0 0 / 20px 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리줄과 메뉴 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .7rem;
  padding: .6rem 1rem; padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.menu-btn { width: 2.7rem; height: 2.7rem; border-radius: 12px; border: var(--bw) solid var(--navy); background: var(--paper);
  box-shadow: 3px 3px 0 var(--shadow); font-size: 1.15rem; line-height: 1; color: var(--navy); }
.logo { display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--navy); font-family: var(--title); font-size: 1.45rem; line-height: 1; }
.logo .app { width: 2.3rem; height: 2.3rem; border-radius: 10px; background: var(--blue); display: grid; place-items: center; box-shadow: 2px 3px 0 var(--navy); }
.side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(80vw, 17rem); background: var(--paper); border-right: var(--bw) solid var(--navy);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 1rem; transform: translateX(-105%); transition: transform .2s; display: flex; flex-direction: column; gap: .3rem; }
.side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(15, 31, 69, .4); }
.side a { display: block; padding: .75rem .9rem; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; }
.side a:hover { background: var(--blue-soft); }
.side .side-head { font-family: var(--title); font-size: 1.2rem; color: var(--navy); padding: .2rem .9rem .5rem; }
.main { padding: 1rem 1rem 2.5rem; max-width: 72rem; margin: 0 auto; }
main:focus { outline: none; }

/* 공통 조각 */
.card { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); }
.h-sec { font-family: var(--title); font-weight: 400; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); color: var(--navy); line-height: 1.25; }
.band { background: linear-gradient(transparent 46%, var(--point) 46%, var(--point) 92%, transparent 92%); }
.num { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--point); border: var(--bw) solid var(--navy); color: var(--navy);
  display: grid; place-items: center; font-family: var(--title); font-size: 1.35rem; line-height: 1; flex: none; }
.chip { display: inline-flex; align-items: center; border: var(--bw) solid var(--navy); background: var(--paper); border-radius: 999px; padding: .3rem 1rem;
  font-weight: 700; color: var(--navy); font-size: .92rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: var(--bw) solid var(--navy); border-radius: var(--r-btn);
  padding: .8rem 1.5rem; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--navy); transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--navy); }
.btn.sub { background: var(--paper); color: var(--navy); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== 이 화면 원래 스타일 (B·A, 색 이름은 테마 값을 그대로 씀) ===== */
h1 { font-size: 1.75rem; line-height: 1.3; margin: 0 0 .5rem; font-weight: 700; letter-spacing: -0.01em; }
.lead { color: var(--muted); margin: 0 0 2rem; }
label { display: block; font-weight: 500; margin-bottom: .5rem; }
.row { display: flex; gap: .5rem; }
input {
  flex: 1; min-width: 0;
  font: 400 1rem/1.4 var(--mono);
  color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 10px;
  padding: .85rem .9rem;
}
button {
  font: 500 1rem var(--sans);
  color: var(--paper); background: var(--ink);
  border: 0; border-radius: 10px; padding: 0 1.2rem; cursor: pointer;
}
button:disabled { opacity: .5; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hint { font-size: .875rem; color: var(--muted); margin: .6rem 0 0; }
.examples { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
.examples button {
  font: 400 .8rem var(--mono); color: var(--ink); background: transparent;
  border: 1px solid var(--line); padding: .35rem .6rem; border-radius: 8px;
}
#result { margin-top: 2.25rem; }
.verdict { border-radius: 14px; padding: 1.25rem 1.25rem 1rem; }
.verdict.danger { background: var(--danger-soft); color: var(--danger); }
.verdict.caution { background: var(--caution-soft); color: var(--caution); }
.verdict.safe { background: var(--safe-soft); color: var(--safe); }
.score { display: flex; align-items: baseline; gap: .6rem; }
.score strong { font-size: 3.25rem; line-height: 1; font-weight: 700; }
.score span { font-size: 1rem; }
.verdict p { margin: .6rem 0 0; font-weight: 500; }
.target { font: 400 .85rem var(--mono); color: var(--muted); margin: .9rem 0 0; word-break: break-all; }
h2 { font-size: 1.05rem; margin: 1.75rem 0 .5rem; }
ul.reasons { list-style: none; margin: 0; padding: 0; }
ul.reasons li { display: flex; gap: 1rem; justify-content: space-between; padding: .8rem 0; border-top: 1px solid var(--line); }
ul.reasons li:last-child { border-bottom: 1px solid var(--line); }
.factor { font-weight: 500; display: block; }
.text { color: var(--muted); font-size: .925rem; }
.pts { font-weight: 700; white-space: nowrap; }
.note { font-size: .9rem; color: var(--muted); margin: 1rem 0 0; }
.error { color: var(--danger); margin-top: 1rem; }
@media (prefers-reduced-motion: no-preference) {
  .verdict { animation: show .25s ease-out; }
  @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

/* ===== 포스터 테마를 차분하게 (A 11/20) =====
   하는 일: 첫 화면·체험과 같은 바탕·글꼴·남색 테두리를 쓰되, 마스코트와 장식은 빼고 그림자를 얕게 한다
   이유: 한 작품처럼 보이게 하면서, 실제로 쓰는 도구 화면(링크 검사, 매뉴얼, 관리자)은 믿음이 가게 */
:root { --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; --focus: var(--blue); --accent: var(--blue); }
main.main { word-break: keep-all; overflow-wrap: anywhere; }
main h1 { font-family: var(--title); font-weight: 400; color: var(--navy); font-size: clamp(1.8rem, 1.4rem + 1.4vw, 2.4rem); line-height: 1.3; margin: .4rem 0 .5rem; letter-spacing: 0; }
main h2 { color: var(--navy); }
.menu-btn { padding: 0; display: grid; place-items: center; }
.back-btn { color: var(--navy); font-weight: 700; text-decoration: none; display: inline-block; margin-top: .3rem; }
.soft { background: var(--paper); border: 2px solid var(--navy); border-radius: 18px; box-shadow: 3px 4px 0 var(--shadow); }
main.main { max-width: 40rem; }
#form label { color: var(--navy); font-weight: 700; }
#form input { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-btn); }
#go { background: var(--blue); color: #fff; border: var(--bw) solid var(--navy); border-radius: var(--r-btn); box-shadow: 3px 3px 0 var(--navy); font-weight: 700; padding: 0 1.3rem; }
#go:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--navy); }
.examples button { background: var(--paper); border: 2px solid var(--line); border-radius: 999px; color: var(--navy); padding: .35rem .8rem; }
.examples button:hover { border-color: var(--navy); }
.verdict { border: 2px solid var(--navy); border-radius: 18px; box-shadow: 3px 4px 0 var(--shadow); }
.score strong { font-family: var(--title); font-weight: 400; }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side">☰</button>
  <a class="logo" href="/"><span class="app"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="6" width="22" height="16" rx="4" fill="#fff"/><path d="M5 9l9 6 9-6" fill="none" stroke="#2563C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>캐치피싱</a>
</header>
<nav class="side" id="side" aria-label="메뉴">
  <p class="side-head">메뉴</p>
  <a href="/">첫 화면</a>
  <a href="/check" aria-current="page">링크 검사</a>
  <a href="/manual">대응 매뉴얼</a>
  </nav>

<main class="main" id="main">
  <h1>이 링크, 눌러도 될까요?</h1>
  <p class="lead">문자나 메일로 받은 링크를 붙여 넣으면 위험한 점을 찾아 알려 드려요. 링크에 직접 접속하지 않고 주소만 분석하니 안심하세요.</p>

  <form id="form" novalidate>
    <label for="url">검사할 링크</label>
    <div class="row">
      <input id="url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="예: gov-support.example/apply" required maxlength="2000">
      <button id="go" type="submit">검사하기</button>
    </div>
    <p class="hint">연습해 보기</p>
    <div class="examples">
      <button type="button" data-url="http://gov-support.example/apply">gov-support.example/apply</button>
      <button type="button" data-url="https://taiegram-login.example/verify">taiegram-login.example/verify</button>
      <button type="button" data-url="https://www.gov.kr/">www.gov.kr</button>
    </div>
  </form>

  <section id="result" aria-live="polite"></section>

  <p class="note" style="margin-top:2.5rem"><a href="/" style="color:var(--blue);font-weight:700">피싱 대응 체험 해 보기</a> · 문자·메일로 내 대응 습관을 확인해요</p>

</main>

<script>
const form = document.getElementById('form');
const input = document.getElementById('url');
const go = document.getElementById('go');
const result = document.getElementById('result');

// 확인 못 한 항목의 코드 이름을 읽기 쉬운 말로 바꿈 (B 설계 6-3 초안)
const UNAVAILABLE = {
  whois: '도메인이 언제 만들어졌는지 확인하지 못했어요',
  spf: '메일 서버 검사 결과가 없어요'
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const AI_THRESHOLD = 0.6;  // AI 판단 숫자를 보여 주는 기준 (url_model.json threshold)

// 점수 구간 (임시, 팀 논의로 조정)
function verdict(score) {
  if (score >= 60) return { cls: 'danger', word: '위험해요', tip: '링크를 누르지 말고, 공식 앱이나 대표번호로 직접 확인하세요.' };
  if (score >= 30) return { cls: 'caution', word: '주의가 필요해요', tip: '보낸 사람을 공식 경로로 한 번 더 확인한 뒤에 여세요.' };
  return { cls: 'safe', word: '눈에 띄는 위험 신호가 없어요', tip: '그래도 개인정보나 비밀번호를 요구하면 한 번 더 의심하세요.' };
}

function render(r) {
  const v = verdict(r.score);
  let html = `<div class="verdict ${v.cls}">
      <div class="score"><strong>${r.score}</strong><span>/ 100점</span></div>
      <p>${v.word}</p>
    </div>
    <p class="target">${esc(r.input)}</p>`;
  if (r.reasons.length) {
    html += '<h2>이렇게 판단했어요</h2><ul class="reasons">' +
      r.reasons.map(x => `<li><div><span class="factor">${esc(x.factor)}</span><span class="text">${esc(x.text)}</span></div><span class="pts">+${x.points}</span></li>`).join('') +
      '</ul>';
  }
  // 하는 일: AI 모델 확률을 한 줄로 보여 준다. 60% 이상일 때만 숫자, 아래는 숫자 없이 "구별하기 어려워요"
  // 이유: 39%와 34%처럼 의미 없는 차이를 숫자로 보여 주지 않으려고 (A 10/29 결정, 정상 오의심 100개 중 1.2개 기준)
  // 참고: 기준 0.6은 url_model.json의 threshold와 같다. 위험 점수(규칙)와는 따로 보여 주는 보조 정보
  if (typeof r.model_probability === 'number') {
    html += r.model_probability >= AI_THRESHOLD
      ? `<p class="note">AI 판단: 주소 모양이 피싱과 비슷해요 (${Math.round(r.model_probability * 100)}%)</p>`
      : `<p class="note">AI 판단: 주소 모양만으로는 구별하기 어려워요</p>`;
  }
  if (r.unavailable.length) {
    html += `<p class="note">${r.unavailable.map(u => esc(UNAVAILABLE[u] || u)).join(', ')}. 이 항목이 빠져서 실제 위험보다 점수가 낮게 나올 수 있어요.</p>`;
  }
  html += `<p class="note">${v.tip}</p>`;
  result.innerHTML = html;
}

async function check(url) {
  if (!url.trim()) { result.innerHTML = '<p class="error">검사할 링크를 입력해 주세요.</p>'; input.focus(); return; }
  go.disabled = true; go.textContent = '검사 중';
  try {
    const res = await fetch('/api/check-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '검사하지 못했어요.');
    render(data);
  } catch (e) {
    result.innerHTML = `<p class="error">${esc(e.message || '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.')}</p>`;
  } finally {
    go.disabled = false; go.textContent = '검사하기';
  }
}

form.addEventListener('submit', e => { e.preventDefault(); check(input.value); });
document.querySelectorAll('.examples button').forEach(b => b.addEventListener('click', () => {
  input.value = b.dataset.url; input.focus();
}));
</script>
<script>
// 하는 일: ☰ 메뉴 열고 닫기 (다른 화면과 같음, A 11/20)
(() => {
  const side = document.getElementById("side"), menuBtn = document.getElementById("menuBtn");
  const setMenu = open => { side.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); };
  menuBtn.onclick = () => setMenu(!side.classList.contains("open"));
  document.addEventListener("click", e => { if (side.classList.contains("open") && !side.contains(e.target) && e.target !== menuBtn) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
})();
</script>
</body>
</html>
