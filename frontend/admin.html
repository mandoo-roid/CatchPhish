<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>캐치피싱 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 포스터 테마 (A 11/19, 포스터 2장 색·글꼴·카드 모양을 사이트에 옮김) =====
   색: 포스터 파일에서 뽑은 값 (A 개인 메모 5번). 글꼴: 제목 주아체(Jua), 본문 본고딕(Noto Sans KR), 둘 다 OFL (B 11/16)
   카드: 흰 바탕 + 남색 두꺼운 테두리 + 오른쪽 아래 진한 그림자 (포스터 "이런 걸 할 수 있어요" 카드) */
:root {
  color-scheme: light;
  --bg: #E7ECF4; --dot: #CBD5E5; --paper: #FFFFFF; --field: #F2F5FA; --line: #D3DCEA;
  --navy: #0F1F45; --ink: #1B2A41; --muted: #56657D; --blue: #2563C9; --blue-soft: #E3ECFA; --circle: #CFDCF0;
  --point: #FFE699; --mascot: #3B7BE0; --shadow: #B8C4D8;
  --danger: #C62828; --danger-soft: #FDECEC; --caution: #8A5A00; --caution-soft: #FFF3D1; --safe: #1E7A4E; --safe-soft: #E3F4EA;
  --title: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-card: 22px; --r-btn: 14px; --bw: 2.5px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; font-size: 17px; }
@media (min-width: 56rem) { html { font-size: 19px; } }
body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg) radial-gradient(var(--dot) 1.3px, transparent 1.5px) 0 0 / 20px 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리줄과 메뉴 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .7rem;
  padding: .6rem 1rem; padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.menu-btn { width: 2.7rem; height: 2.7rem; border-radius: 12px; border: var(--bw) solid var(--navy); background: var(--paper);
  box-shadow: 3px 3px 0 var(--shadow); font-size: 1.15rem; line-height: 1; color: var(--navy); }
.logo { display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--navy); font-family: var(--title); font-size: 1.45rem; line-height: 1; }
.logo .app { width: 2.3rem; height: 2.3rem; border-radius: 10px; background: var(--blue); display: grid; place-items: center; box-shadow: 2px 3px 0 var(--navy); }
.side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(80vw, 17rem); background: var(--paper); border-right: var(--bw) solid var(--navy);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 1rem; transform: translateX(-105%); transition: transform .2s; display: flex; flex-direction: column; gap: .3rem; }
.side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(15, 31, 69, .4); }
.side a { display: block; padding: .75rem .9rem; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; }
.side a:hover { background: var(--blue-soft); }
.side .side-head { font-family: var(--title); font-size: 1.2rem; color: var(--navy); padding: .2rem .9rem .5rem; }
.main { padding: 1rem 1rem 2.5rem; max-width: 72rem; margin: 0 auto; }
main:focus { outline: none; }

/* 공통 조각 */
.card { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); }
.h-sec { font-family: var(--title); font-weight: 400; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); color: var(--navy); line-height: 1.25; }
.band { background: linear-gradient(transparent 46%, var(--point) 46%, var(--point) 92%, transparent 92%); }
.num { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--point); border: var(--bw) solid var(--navy); color: var(--navy);
  display: grid; place-items: center; font-family: var(--title); font-size: 1.35rem; line-height: 1; flex: none; }
.chip { display: inline-flex; align-items: center; border: var(--bw) solid var(--navy); background: var(--paper); border-radius: 999px; padding: .3rem 1rem;
  font-weight: 700; color: var(--navy); font-size: .92rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: var(--bw) solid var(--navy); border-radius: var(--r-btn);
  padding: .8rem 1.5rem; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--navy); transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--navy); }
.btn.sub { background: var(--paper); color: var(--navy); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== 이 화면 원래 스타일 (B·A, 색 이름은 테마 값을 그대로 씀) ===== */
h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
h2 { font-size: 1.05rem; margin: 2rem 0 .75rem; }
.muted { color: var(--muted); }
.row { display: flex; gap: .5rem; max-width: 26rem; }
input { flex: 1; min-width: 0; font: 400 1rem var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: .8rem .9rem; }
button { font: 500 1rem var(--sans); color: var(--paper); background: var(--ink); border: 0; border-radius: 10px; padding: 0 1.1rem; cursor: pointer; }
button.secondary { color: var(--ink); background: transparent; border: 1px solid var(--line); padding: .7rem 1.1rem; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; }
.card { background: var(--field); border-radius: 12px; padding: 1rem; }
.card b { display: block; font-size: 1.6rem; line-height: 1.2; }
.card span { font-size: .85rem; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 6rem; }
.bar i { display: block; height: 100%; background: var(--ink); }
.notice { background: var(--field); border-radius: 12px; padding: 1rem 1.25rem; }
.result-ok { background: var(--safe-soft); color: var(--safe); border-radius: 12px; padding: 1rem 1.25rem; font-weight: 500; }
.result-bad { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 1rem 1.25rem; font-weight: 500; }
.error { color: var(--danger); }
[hidden] { display: none !important; }

/* ===== 포스터 테마를 차분하게 (A 11/20) =====
   하는 일: 첫 화면·체험과 같은 바탕·글꼴·남색 테두리를 쓰되, 마스코트와 장식은 빼고 그림자를 얕게 한다
   이유: 한 작품처럼 보이게 하면서, 실제로 쓰는 도구 화면(링크 검사, 매뉴얼, 관리자)은 믿음이 가게 */
:root { --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; --focus: var(--blue); --accent: var(--blue); }
main.main { word-break: keep-all; overflow-wrap: anywhere; }
main h1 { font-family: var(--title); font-weight: 400; color: var(--navy); font-size: clamp(1.8rem, 1.4rem + 1.4vw, 2.4rem); line-height: 1.3; margin: .4rem 0 .5rem; letter-spacing: 0; }
main h2 { color: var(--navy); }
.menu-btn { padding: 0; display: grid; place-items: center; }
.back-btn { color: var(--navy); font-weight: 700; text-decoration: none; display: inline-block; margin-top: .3rem; }
.soft { background: var(--paper); border: 2px solid var(--navy); border-radius: 18px; box-shadow: 3px 4px 0 var(--shadow); }
main.main { max-width: 58rem; }
#stats { margin-top: 1.3rem; }
.cards { margin-bottom: .4rem; }
#form input { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-btn); }
#form button { background: var(--blue); color: #fff; border: var(--bw) solid var(--navy); border-radius: var(--r-btn); box-shadow: 3px 3px 0 var(--navy); font-weight: 700; }
button.secondary { background: var(--paper); color: var(--navy); border: 2px solid var(--navy); border-radius: var(--r-btn); font-weight: 700; box-shadow: 3px 3px 0 var(--shadow); }
.cards .card { background: var(--paper); border: 2px solid var(--navy); border-radius: 16px; box-shadow: 3px 4px 0 var(--shadow); }
.cards .card b { font-family: var(--title); font-weight: 400; color: var(--navy); font-size: 1.9rem; }
.table-wrap { background: var(--paper); border: 2px solid var(--navy); border-radius: 16px; box-shadow: 3px 4px 0 var(--shadow); padding: .3rem .9rem; }
th { color: var(--navy); font-weight: 700; }
.bar { background: var(--field); border: 1.5px solid var(--navy); height: 10px; }
.bar i { background: var(--blue); }
.notice { background: var(--paper); border: 2px solid var(--line); }
.result-ok, .result-bad { border: 2px solid currentColor; }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side">☰</button>
  <a class="logo" href="/"><span class="app"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="6" width="22" height="16" rx="4" fill="#fff"/><path d="M5 9l9 6 9-6" fill="none" stroke="#2563C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>캐치피싱</a>
</header>
<nav class="side" id="side" aria-label="메뉴">
  <p class="side-head">메뉴</p>
  <a href="/" aria-current="page">첫 화면</a>
  <a href="/check">링크 검사</a>
  <a href="/manual">대응 매뉴얼</a>
  </nav>
<main class="main" id="main">
  <a class="back-btn" href="/">‹ 처음으로</a>
  <h1>관리자 화면</h1>
  <p class="muted">직군별로 어떤 피싱에 약한지 확인해요. 개인별 결과는 보이지 않아요.</p>

  <section id="login">
    <h2>회사 코드</h2>
    <form id="form" class="row" novalidate>
      <input id="code" type="password" autocomplete="off" placeholder="회사 코드 입력" aria-label="회사 코드">
      <button type="submit">들어가기</button>
    </form>
    <p class="error" id="login-error" role="alert"></p>
  </section>

  <section id="dash" hidden>
    <div id="stats"></div>
    <h2>기록 검사</h2>
    <p class="muted">체험 기록이 몰래 바뀌거나 지워지지 않았는지 해시체인으로 확인해요.</p>
    <button class="secondary" id="verify">기록 검사하기</button>
    <div id="verify-result" style="margin-top:1rem" aria-live="polite"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const JOB = { hr: "인사", finance: "재무·회계", sales: "영업·고객", dev: "개발·IT", office: "일반 사무" };
let code = "";

async function post(url) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ company_code: code }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "서버에 연결하지 못했어요.");
  return data;
}
// 하는 일: 비율(0~1)을 %로 바꾼다. 값이 없으면(null) 0%가 아니라 "-"
// 이유: 기록이 없는데 0%로 보이면 사실과 다른 숫자가 된다 (C의 stats.py는 계산할 수 없으면 null을 보냄)
const pct = x => (typeof x === "number" ? `${Math.round(x * 100)}%` : "-");
const barWidth = x => (typeof x === "number" ? `${Math.round(x * 100)}%` : "0%");

function renderStats(d) {
  if (!d.connected) { $("stats").innerHTML = `<div class="notice">${esc(d.message)}</div>`; return; }
  if (!d.participants) { $("stats").innerHTML = `<div class="notice">아직 체험 기록이 없어요. 직원들이 게임을 하면 여기에 숫자가 나타나요.</div>`; return; }
  const gap = d.confidence_gap || {};
  let h = `<div class="cards">
    <div class="card"><b>${esc(d.participants)}</b><span>참여 인원</span></div>
    <div class="card"><b>${pct(d.over_suspicion_rate)}</b><span>정상 메시지 과잉 의심</span></div>
  </div>
  <h2>자신감과 실제 결과</h2>
  <div class="cards">
    <div class="card"><b>${pct(gap.confident_wrong_rate)}</b><span>"자신 있다"(4·5점)고 한 사람의 오답률</span></div>
    <div class="card"><b>${pct(gap.unconfident_wrong_rate)}</b><span>"자신 없다"(1~3점)고 한 사람의 오답률</span></div>
  </div>`;
  const jobs = Object.entries(d.wrong_rate_by_job || {});
  h += `<h2>직군별 오답률</h2>`;
  if (jobs.length) {
    h += `<div class="table-wrap"><table><thead><tr><th>직군</th><th>오답률</th><th></th></tr></thead><tbody>` +
      jobs.map(([j, r]) => `<tr><td>${esc(JOB[j] || j)}</td><td>${pct(r)}</td><td><div class="bar"><i style="width:${barWidth(r)}"></i></div></td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  h += `<p class="muted" style="font-size:.9rem">참여 인원이 3명보다 적은 직군은 한 사람의 결과가 드러나지 않도록 표에서 빼요.</p>`;
  if ((d.weak_types || []).length) {
    h += `<h2>많이 속은 유형</h2><div class="table-wrap"><table><thead><tr><th>유형</th><th>속은 횟수</th></tr></thead><tbody>` +
      d.weak_types.map(t => `<tr><td>${esc(t.type)}</td><td>${esc(t.count)}</td></tr>`).join("") + `</tbody></table></div>`;
  }
  // 하는 일: 다시 도전 효과. 1회차와 2회차(처음 보는 문제)를 모두 한 사람의 회차별 비율을 나란히 보여 준다 (A 11/02)
  // 이유: 교육을 받은 뒤 실제로 나아지는지 회사가 확인하게 하려고 (교수님 피드백 "교육 효과가 보이게")
  // 참고: 위 통계(참여 인원, 직군별 오답률 등)는 1회차 기록만으로 계산한다. 비율은 0~1, 계산할 수 없으면 null
  const re = d.retry_effect;
  h += `<h2>다시 도전 효과</h2>`;
  if (re && re.people) {
    const row = (label, a, b) => `<tr><td>${label}</td><td>${pct(a)}</td><td>${pct(b)}</td><td>${typeof a === "number" && typeof b === "number" ? (b > a ? "▲ " : b < a ? "▼ " : "") + Math.abs(Math.round((b - a) * 100)) + "%p" : "-"}</td></tr>`;
    h += `<p class="muted" style="font-size:.9rem">1회차를 마치고 처음 보는 문제로 다시 도전한 ${esc(re.people)}명의 결과예요.</p>
      <div class="table-wrap"><table><thead><tr><th></th><th>1회차</th><th>2회차 (새 문제)</th><th>변화</th></tr></thead><tbody>` +
      row("피싱을 막은 비율", re.round1.phishing_blocked, re.round2.phishing_blocked) +
      row("정상 업무를 처리한 비율", re.round1.normal_handled, re.round2.normal_handled) +
      `</tbody></table></div>
      <p class="muted" style="font-size:.9rem">피싱을 막은 비율이 나아진 사람 ${esc(re.improved)}명 · 같은 사람 ${esc(re.same)}명 · 낮아진 사람 ${esc(re.worse)}명</p>`;
  } else {
    h += `<p class="muted" style="font-size:.9rem">아직 다시 도전한 사람이 없어요. 결과 화면에서 [새 문제로 다시 도전]을 하면 여기에 나타나요.</p>`;
  }
  $("stats").innerHTML = h;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault(); code = $("code").value.trim(); $("login-error").textContent = "";
  if (!code) { $("login-error").textContent = "회사 코드를 입력해 주세요."; return; }
  try { renderStats(await post("/api/admin/stats")); $("login").hidden = true; $("dash").hidden = false; }
  catch (err) { $("login-error").textContent = err.message; }
});

$("verify").onclick = async () => {
  $("verify-result").innerHTML = "";
  try {
    const r = await post("/api/admin/verify");
    if (r.connected === false) $("verify-result").innerHTML = `<div class="notice">${esc(r.message)}</div>`;
    else if (r.ok) $("verify-result").innerHTML = `<div class="result-ok">이상 없음: 기록 ${r.count}개가 모두 원래대로예요.</div>`;
    else $("verify-result").innerHTML = `<div class="result-bad">${r.broken_seq}번째 기록에서 문제 발견: ${esc(r.reason)}</div>`;
  } catch (err) { $("verify-result").innerHTML = `<p class="error">${esc(err.message)}</p>`; }
};
</script>
<script>
// 하는 일: ☰ 메뉴 열고 닫기 (다른 화면과 같음, A 11/20)
(() => {
  const side = document.getElementById("side"), menuBtn = document.getElementById("menuBtn");
  const setMenu = open => { side.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); };
  menuBtn.onclick = () => setMenu(!side.classList.contains("open"));
  document.addEventListener("click", e => { if (side.classList.contains("open") && !side.contains(e.target) && e.target !== menuBtn) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
})();
</script>
</body>
</html>
