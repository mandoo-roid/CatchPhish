<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>캐치피싱 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --ink: #1B2A41; --muted: #5B6B7D; --paper: #FFFFFF; --field: #F1F4F7; --line: #D5DDE3; --focus: #2457C5;
  --danger: #B3261E; --safe: #1F6B4A; --safe-soft: #E4F3EB; --danger-soft: #FCEBEA;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --ink: #E6ECF2; --muted: #9AA8B6; --paper: #12181F; --field: #1C242D; --line: #2E3A46; --focus: #8DB2FF;
    --danger: #FF8A80; --safe: #7FD3A8; --safe-soft: #16302A; --danger-soft: #3A1D1B; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
main { max-width: 52rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
h2 { font-size: 1.05rem; margin: 2rem 0 .75rem; }
.muted { color: var(--muted); }
.row { display: flex; gap: .5rem; max-width: 26rem; }
input { flex: 1; min-width: 0; font: 400 1rem var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: .8rem .9rem; }
button { font: 500 1rem var(--sans); color: var(--paper); background: var(--ink); border: 0; border-radius: 10px; padding: 0 1.1rem; cursor: pointer; }
button.secondary { color: var(--ink); background: transparent; border: 1px solid var(--line); padding: .7rem 1.1rem; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; }
.card { background: var(--field); border-radius: 12px; padding: 1rem; }
.card b { display: block; font-size: 1.6rem; line-height: 1.2; }
.card span { font-size: .85rem; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 6rem; }
.bar i { display: block; height: 100%; background: var(--ink); }
.notice { background: var(--field); border-radius: 12px; padding: 1rem 1.25rem; }
.result-ok { background: var(--safe-soft); color: var(--safe); border-radius: 12px; padding: 1rem 1.25rem; font-weight: 500; }
.result-bad { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 1rem 1.25rem; font-weight: 500; }
.error { color: var(--danger); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p style="margin:0 0 1.5rem"><a href="/" style="color:inherit;font-size:.9rem">← 처음으로</a></p>
  <h1>관리자 화면</h1>
  <p class="muted">직군별로 어떤 피싱에 약한지 확인해요. 개인별 결과는 보이지 않아요.</p>

  <section id="login">
    <h2>회사 코드</h2>
    <form id="form" class="row" novalidate>
      <input id="code" type="password" autocomplete="off" placeholder="회사 코드 입력" aria-label="회사 코드">
      <button type="submit">들어가기</button>
    </form>
    <p class="error" id="login-error" role="alert"></p>
  </section>

  <section id="dash" hidden>
    <div id="stats"></div>
    <h2>기록 검사</h2>
    <p class="muted">체험 기록이 몰래 바뀌거나 지워지지 않았는지 해시체인으로 확인해요.</p>
    <button class="secondary" id="verify">기록 검사하기</button>
    <div id="verify-result" style="margin-top:1rem" aria-live="polite"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const JOB = { hr: "인사", finance: "재무·회계", sales: "영업·고객", dev: "개발·IT", office: "일반 사무" };
let code = "";

async function post(url) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ company_code: code }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "서버에 연결하지 못했어요.");
  return data;
}
const pct = x => `${Math.round((x || 0) * 100)}%`;

function renderStats(d) {
  if (!d.connected) { $("stats").innerHTML = `<div class="notice">${esc(d.message)}</div>`; return; }
  let h = `<div class="cards">
    <div class="card"><b>${d.participants}</b><span>참여 인원</span></div>
    <div class="card"><b>${pct(d.over_suspicion_rate)}</b><span>정상 메시지 과잉 의심</span></div>
    <div class="card"><b>${pct(d.confidence_gap?.confident_wrong_rate)}</b><span>"자신 있다"고 한 사람의 오답률</span></div>
  </div>`;
  const jobs = Object.entries(d.wrong_rate_by_job || {});
  if (jobs.length) {
    h += `<h2>직군별 오답률</h2><div class="table-wrap"><table><thead><tr><th>직군</th><th>오답률</th><th></th></tr></thead><tbody>` +
      jobs.map(([j, r]) => `<tr><td>${esc(JOB[j] || j)}</td><td>${pct(r)}</td><td><div class="bar"><i style="width:${pct(r)}"></i></div></td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  if ((d.weak_types || []).length) {
    h += `<h2>많이 속은 유형</h2><div class="table-wrap"><table><thead><tr><th>유형</th><th>속은 횟수</th></tr></thead><tbody>` +
      d.weak_types.map(t => `<tr><td>${esc(t.type)}</td><td>${t.count}</td></tr>`).join("") + `</tbody></table></div>`;
  }
  $("stats").innerHTML = h;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault(); code = $("code").value.trim(); $("login-error").textContent = "";
  if (!code) { $("login-error").textContent = "회사 코드를 입력해 주세요."; return; }
  try { renderStats(await post("/api/admin/stats")); $("login").hidden = true; $("dash").hidden = false; }
  catch (err) { $("login-error").textContent = err.message; }
});

$("verify").onclick = async () => {
  $("verify-result").innerHTML = "";
  try {
    const r = await post("/api/admin/verify");
    if (r.connected === false) $("verify-result").innerHTML = `<div class="notice">${esc(r.message)}</div>`;
    else if (r.ok) $("verify-result").innerHTML = `<div class="result-ok">이상 없음: 기록 ${r.count}개가 모두 원래대로예요.</div>`;
    else $("verify-result").innerHTML = `<div class="result-bad">${r.broken_seq}번째 기록에서 문제 발견: ${esc(r.reason)}</div>`;
  } catch (err) { $("verify-result").innerHTML = `<p class="error">${esc(err.message)}</p>`; }
};
</script>
</body>
</html>
