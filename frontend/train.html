<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자유 훈련 · 캐치피싱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 포스터 테마 (A 11/19, 포스터 2장 색·글꼴·카드 모양을 사이트에 옮김) =====
   색: 포스터 파일에서 뽑은 값 (A 개인 메모 5번). 글꼴: 제목 주아체(Jua), 본문 본고딕(Noto Sans KR), 둘 다 OFL (B 11/16)
   카드: 흰 바탕 + 남색 두꺼운 테두리 + 오른쪽 아래 진한 그림자 (포스터 "이런 걸 할 수 있어요" 카드) */
:root {
  color-scheme: light;
  --bg: #E7ECF4; --dot: #CBD5E5; --paper: #FFFFFF; --field: #F2F5FA; --line: #D3DCEA;
  --navy: #0F1F45; --ink: #1B2A41; --muted: #56657D; --blue: #2563C9; --blue-soft: #E3ECFA; --circle: #CFDCF0;
  --point: #FFE699; --mascot: #3B7BE0; --shadow: #B8C4D8;
  --danger: #C62828; --danger-soft: #FDECEC; --caution: #8A5A00; --caution-soft: #FFF3D1; --safe: #1E7A4E; --safe-soft: #E3F4EA;
  --title: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-card: 22px; --r-btn: 14px; --bw: 2.5px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; font-size: 17px; }
@media (min-width: 56rem) { html { font-size: 19px; } }   /* 글씨 크게 (A 11/20: 전체적으로 너무 작음) */
body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg) radial-gradient(var(--dot) 1.3px, transparent 1.5px) 0 0 / 20px 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리줄과 메뉴 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .7rem;
  padding: .6rem 1rem; padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.menu-btn { width: 2.7rem; height: 2.7rem; border-radius: 12px; border: var(--bw) solid var(--navy); background: var(--paper);
  box-shadow: 3px 3px 0 var(--shadow); font-size: 1.15rem; line-height: 1; color: var(--navy); }
.logo { display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--navy); font-family: var(--title); font-size: 1.45rem; line-height: 1; }
.logo .app { width: 2.3rem; height: 2.3rem; border-radius: 10px; background: var(--blue); display: grid; place-items: center; box-shadow: 2px 3px 0 var(--navy); }
.side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(80vw, 17rem); background: var(--paper); border-right: var(--bw) solid var(--navy);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 1rem; transform: translateX(-105%); transition: transform .2s; display: flex; flex-direction: column; gap: .3rem; }
.side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(15, 31, 69, .4); }
.side a { display: block; padding: .75rem .9rem; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; }
.side a:hover { background: var(--blue-soft); }
.side .side-head { font-family: var(--title); font-size: 1.2rem; color: var(--navy); padding: .2rem .9rem .5rem; }
.main { padding: 1rem 1rem 2.5rem; max-width: 72rem; margin: 0 auto; }
main:focus { outline: none; }

/* 공통 조각 */
.card { background: var(--paper); border: var(--bw) solid var(--navy); border-radius: var(--r-card); box-shadow: 6px 7px 0 var(--shadow); }
.h-sec { font-family: var(--title); font-weight: 400; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); color: var(--navy); line-height: 1.25; }
.band { background: linear-gradient(transparent 46%, var(--point) 46%, var(--point) 92%, transparent 92%); }
.num { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--point); border: var(--bw) solid var(--navy); color: var(--navy);
  display: grid; place-items: center; font-family: var(--title); font-size: 1.35rem; line-height: 1; flex: none; }
.chip { display: inline-flex; align-items: center; border: var(--bw) solid var(--navy); background: var(--paper); border-radius: 999px; padding: .3rem 1rem;
  font-weight: 700; color: var(--navy); font-size: .92rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: var(--bw) solid var(--navy); border-radius: var(--r-btn);
  padding: .8rem 1.5rem; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--navy); transition: transform .08s, box-shadow .08s; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--navy); }
.btn.sub { background: var(--paper); color: var(--navy); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ===== 자유 훈련: 생활 속 피싱 신호 익히기 (A 11/19, docs/game_draft.html 시안을 사이트로 옮기고 포스터 테마로) =====
   규칙은 시안 그대로: 60초, 20초마다 1·2·3단계, 피싱 카드를 8초 안 누르면 놓침, 틀린 정상 문자는 약 12초 뒤 다시 나옴
   카드 수(8장)와 시간은 폰과 PC가 같다 (팀 결정 20번). 폰은 2열, 넓은 화면은 4열 + 왼쪽 점수판 */
.back-btn { border: 0; background: none; color: var(--navy); font-weight: 700; padding: .2rem 0; margin-bottom: .8rem; text-decoration: none; display: inline-block; }
.title { font-family: var(--title); font-weight: 400; font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.5rem); color: var(--navy); line-height: 1.25; }
.intro { display: grid; gap: 1.6rem; align-items: center; max-width: 60rem; }
.intro .peek { display: block; width: 7rem; }
.intro .peek svg { display: block; width: 100%; height: auto; }
.rules { padding: 1.2rem 1.3rem; margin: 1rem 0 0; display: grid; gap: .6rem; list-style: none; }
.rules li { display: flex; gap: .7rem; align-items: baseline; }
.rules li::before { content: ""; flex: none; width: .65rem; height: .65rem; border-radius: 50%; background: var(--point); border: 2px solid var(--navy); transform: translateY(.05rem); }
.credit { font-size: .82rem; color: var(--muted); margin-top: 1rem; }
@media (min-width: 56rem) { .intro { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); } }

.play { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
.time { white-space: nowrap; }
.panel { position: sticky; top: 4.4rem; z-index: 10; padding: .8rem 1rem; display: grid; gap: .55rem .9rem; align-items: center;
  grid-template-columns: auto 1fr auto auto; grid-template-areas: "score time snd quit" "bar bar bar bar" "lv lv lv lv"; }
.panel .score { grid-area: score; } .panel .time { grid-area: time; } .panel .tbar { grid-area: bar; } .panel .lv { grid-area: lv; } .panel .quit { grid-area: quit; }
.p-row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.score { font-family: var(--title); font-size: 2rem; line-height: 1; color: var(--navy); white-space: nowrap; }
.score small { font-family: var(--sans); font-size: .8rem; color: var(--muted); font-weight: 700; margin-left: .3rem; }
.tbar { height: .9rem; border-radius: 999px; background: var(--field); border: 2px solid var(--navy); overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--blue); transition: width 1s linear, background .3s; }
.tbar.late i { background: var(--point); }
.time { font-weight: 700; color: var(--navy); font-size: .92rem; }
.lv { white-space: nowrap; display: flex; align-items: center; gap: .35rem; font-size: .85rem; font-weight: 700; color: var(--navy); }
.lv i { width: .8rem; height: .8rem; border-radius: 50%; background: var(--paper); border: 2px solid var(--navy); display: inline-block; }
.lv i.on { background: var(--blue); }
.combo { margin-left: .4rem; white-space: nowrap; background: var(--point); color: var(--navy); border: 2px solid var(--navy); border-radius: 999px; padding: .05rem .7rem; font-weight: 900; font-size: .85rem; opacity: 0; transition: opacity .2s; }
.quit { white-space: nowrap; border: 2px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 999px; padding: .25rem .9rem; font-weight: 700; font-size: .85rem; }
.panel .hint { font-size: .85rem; color: var(--muted); }
/* 소리 켜기·끄기 버튼과 콤보 알림 (A 11/23) */
.snd { white-space: nowrap; border: 2px solid var(--navy); background: var(--paper); color: var(--navy); border-radius: 999px; padding: .2rem .65rem; font-size: .95rem; line-height: 1.2; }
.snd[aria-pressed="true"] { background: var(--field); color: var(--muted); }
.panel .snd { grid-area: snd; }
.combo.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.45); } }
.pop { position: fixed; left: 50%; top: 42%; z-index: 45; transform: translate(-50%, -50%); font-family: var(--title); color: var(--navy);
  font-size: clamp(2.2rem, 1.6rem + 3vw, 3.6rem); background: var(--point); border: 3px solid var(--navy); border-radius: 22px; padding: .3rem 1.3rem;
  box-shadow: 5px 6px 0 var(--navy); pointer-events: none; opacity: 0; white-space: nowrap; }
.pop.on { animation: popin .9s ease-out forwards; }
@keyframes popin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  35% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop.on { animation: none; opacity: 1; } }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; align-content: start; }
/* 수정 (A 11/20): 폰에서 카드 8장이 스크롤 없이 한 화면에. 점수판은 두 줄로 줄이고, 판 높이를 남은 화면에 맞춰 4줄로 나눈다 */
@media (max-width: 55.99rem) {
  #play .main, #play { margin-top: -.4rem; }
  .panel { top: 3.9rem; padding: .55rem .8rem; gap: .4rem .7rem; grid-template-columns: auto auto 1fr auto auto; grid-template-areas: "score time lv snd quit" "bar bar bar bar bar"; }
  .panel .lv { justify-self: end; }
  .quit { padding: .2rem .7rem; font-size: .8rem; }
  .snd { padding: .15rem .5rem; font-size: .85rem; }
  /* 폰: 콤보 뱃지는 점수판 위쪽 모서리에 스티커처럼 띄워서 한 줄이 넘치지 않게 (A 11/23) */
  .panel .lv .combo { position: absolute; right: .8rem; top: -.85rem; margin: 0; box-shadow: 2px 2px 0 var(--navy); }
  .lv i { width: .65rem; height: .65rem; }
  .score { font-size: 1.6rem; }
  .board { height: calc(100svh - 15.9rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 20rem; grid-template-rows: repeat(4, 1fr); gap: .55rem; }
  .c { min-height: 0; padding: .5rem .65rem; gap: .15rem; }
  .c .m { font-size: .86rem; line-height: 1.35; }
  .c .why { font-size: .76rem; padding: .5rem .6rem; }
}
@media (max-width: 24.99rem) { .lv i { display: none; } }
@media (min-width: 56rem) {
  .panel { grid-template-columns: auto auto 1fr auto auto auto; grid-template-areas: "score time bar lv snd quit"; padding: .9rem 1.3rem; gap: 1.2rem; }
  .panel .tbar { height: 1.1rem; }
  .board { grid-template-columns: repeat(4, 1fr); gap: 1rem; }
}
.c { position: relative; min-height: 6.4rem; border: var(--bw) solid var(--navy); border-radius: 18px; background: var(--paper); color: var(--ink); padding: .7rem .8rem;
  text-align: left; display: flex; flex-direction: column; gap: .3rem; overflow: hidden; box-shadow: 4px 5px 0 var(--shadow); transition: transform .1s, box-shadow .1s, background .15s; }
@media (min-width: 56rem) { .c { min-height: 9rem; padding: .9rem 1rem; } }
.c:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.c .f { font-size: .78rem; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: .35rem; }
.c .f::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--blue); display: inline-block; flex: none; }
.c .m { font-size: .92rem; line-height: 1.4; font-weight: 500; }
.c.ok { background: var(--blue); color: #fff; } .c.ok .f { color: #DCE8FB; } .c.ok .f::before { background: #fff; }
.c.ng { animation: shk .3s; }
/* 수정 (A 11/24): 틀리면 0.5초 동안 카드가 흐려지고 안 눌린다 (막 누르기 막기) */
.g-lock .c:not(.ng) { opacity: .5; transition: opacity .1s; }
.c.gone { opacity: 0; transform: scale(.7); transition: all .18s; }
.c.in { animation: pin .25s; }
.c .why { position: absolute; inset: 0; color: #fff; font-size: .82rem; line-height: 1.45; padding: .7rem .8rem; display: flex; align-items: center; font-weight: 500; }
.c .why.r { background: var(--danger); } .c .why.y { background: var(--caution); }
.c .bd { position: absolute; right: .5rem; top: .5rem; background: var(--point); color: var(--navy); border: 2px solid var(--navy); font-size: .75rem; font-weight: 900; border-radius: 999px; padding: 0 .55rem; animation: pin .2s; }
@keyframes pin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shk { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.toast { position: fixed; left: 50%; top: 5.5rem; transform: translateX(-50%); background: var(--navy); color: #fff; font-weight: 700; padding: .55rem 1.1rem; border-radius: 999px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 40; white-space: nowrap; box-shadow: 3px 4px 0 var(--shadow); }

.res { display: grid; gap: 1.1rem; max-width: 60rem; }
.big { display: grid; grid-template-columns: repeat(2, 1fr); gap: .8rem; padding: 1.1rem; text-align: center; }
@media (min-width: 40rem) { .big { grid-template-columns: repeat(4, 1fr); } }
.big .n { font-family: var(--title); font-size: 2rem; color: var(--navy); line-height: 1.1; }
.big .l { font-size: .85rem; color: var(--muted); font-weight: 700; }
.two { display: grid; gap: 1.1rem; }
@media (min-width: 56rem) { .two { grid-template-columns: 1fr 1fr; align-items: start; } }
.learn { background: var(--blue); color: #fff; padding: 1.1rem 1.2rem; }
.learn .n { font-family: var(--title); font-size: 1.8rem; }
.tip { background: var(--point); color: var(--navy); padding: 1.1rem 1.2rem; font-weight: 500; }
.box { padding: 1.1rem 1.2rem; }
.box h2 { font-family: var(--title); font-weight: 400; font-size: 1.3rem; color: var(--navy); margin-bottom: .5rem; }
.it { font-size: .9rem; padding: .6rem 0; border-top: 2px dashed var(--line); line-height: 1.55; }
.it:first-of-type { border-top: 0; }
.mt { display: inline-block; font-size: .82rem; font-weight: 700; background: var(--point); color: var(--navy); border: 2px solid var(--navy); border-radius: 999px; padding: 0 .65rem; margin: .2rem .35rem .2rem 0; }
.muted { color: var(--muted); font-size: .9rem; }
/* 순위표 (A 11/24) */
.rk { list-style: none; margin: .3rem 0 0; padding: 0; }
.rk li { display: flex; gap: .6rem; align-items: baseline; padding: .45rem .2rem; border-top: 2px dashed var(--line); overflow-wrap: anywhere; }
.rk li b { min-width: 1.8rem; color: var(--navy); }
.rk li span { flex: 1; }
.rk li.me { background: var(--point); border-radius: 10px; }
.rk li .tag { font-size: .75rem; color: var(--muted); margin-left: .3rem; }
.newtop { font-family: var(--title); font-size: 1.6rem; color: var(--navy); background: var(--point); border: var(--bw) solid var(--navy); border-radius: 14px; padding: .4rem .9rem; display: inline-block; margin-bottom: .5rem; }
.nickrow { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
.nickrow input { flex: 1; min-width: 10rem; border: var(--bw) solid var(--navy); border-radius: 12px; padding: .55rem .8rem; background: var(--paper); }
.row { display: flex; gap: .7rem; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side">☰</button>
  <a class="logo" href="/"><span class="app"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="6" width="22" height="16" rx="4" fill="#fff"/><path d="M5 9l9 6 9-6" fill="none" stroke="#2563C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>캐치피싱</a>
</header>
<nav class="side" id="side" aria-label="메뉴">
  <p class="side-head">메뉴</p>
  <a href="/">첫 화면</a>
  <a href="/check">링크 검사</a>
  <a href="/manual">대응 매뉴얼</a>
</nav>
<main class="main" id="main" tabindex="-1">

  <!-- 시작 화면 -->
  <section id="st">
    <a class="back-btn" href="/">‹ 처음으로</a>
    <div class="intro">
      <div>
        <span class="peek"><svg viewBox="0 0 110 80" aria-hidden="true"><g transform="rotate(-5 50 40)"><rect x="5" y="8" width="84" height="60" rx="12" fill="#3B7BE0" stroke="#2B5FB8" stroke-width="3"/><path d="M11 16 L47 42 L83 16" fill="none" stroke="#DCE8FB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="48" r="7" fill="#fff" stroke="#2B5FB8" stroke-width="2"/><circle cx="58" cy="48" r="7" fill="#fff" stroke="#2B5FB8" stroke-width="2"/><circle cx="37" cy="50" r="3.3" fill="#0F1F45"/><circle cx="61" cy="50" r="3.3" fill="#0F1F45"/><path d="M26 38 l14 2" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/><path d="M52 37 q6 -6 13 -1" fill="none" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/><path d="M41 60 l10 -2" stroke="#0F1F45" stroke-width="3" stroke-linecap="round"/></g><line x1="92" y1="62" x2="83" y2="75" stroke="#2B5FB8" stroke-width="6" stroke-linecap="round"/><circle cx="96" cy="50" r="13" fill="#DCE8FB" fill-opacity=".6" stroke="#2B5FB8" stroke-width="4"/></svg></span>
        <h1 class="title">생활 속 피싱 신호 익히기</h1>
        <p class="muted" style="margin-top:.4rem">60초 동안 오는 문자 알림 중에서 피싱만 골라 눌러요.</p>
        <div class="row" style="margin-top:1.4rem;align-items:center"><button class="btn" id="gobtn">시작하기</button><button class="snd" id="snd0" aria-pressed="false" aria-label="소리 끄기">🔊 소리 켜짐</button></div>
        <p class="muted" style="margin-top:.7rem;font-size:.88rem">게임 중에 소리가 나와요. 끄려면 🔊 버튼을 누르세요.</p>
      </div>
      <div>
        <ul class="rules card">
          <li><span>문자 알림이 계속 와요. <b>피싱 문자만</b> 빠르게 누르세요</span></li>

  const lessons = top.length ? top.map(d => `<p class="it"><b>${esc(d[0])} · ${esc(d[1])}</b> (${d[2] ? "피싱" : "정상"})<br>${esc(d[4])}</p>`).join("") : `<p class="it">헷갈린 문자가 없었어요!</p>`;
  const by = {}; caught.forEach(d => { by[d[5]] = (by[d[5]] || 0) + 1; });
  const tags = Object.keys(by).length ? Object.entries(by).map(([k, v]) => `<span class="mt">${esc(k)} ${v}</span>`).join("") : `<p class="it">아직 없어요</p>`;
  $("res").innerHTML = `
    <div class="res">
      <h1 class="title">끝! 이번 판 결과예요</h1>
      <div class="card big"><div><div class="n">${sc}</div><div class="l">점수</div></div><div><div class="n">${caught.length}</div><div class="l">잡은 피싱</div></div>
        <div><div class="n">${lost.length}</div><div class="l">놓친 피싱</div></div><div><div class="n">${acc}%</div><div class="l">정확도</div></div></div>
      ${rd.length ? `<div class="card learn">틀렸다가 다시 나온 문자<div class="n">${rok} / ${rd.length} 맞힘</div>한 판 안에서 고쳐 배운 정도예요</div>` : ""}
      <div class="card tip">보낸 곳이나 단어 하나로 판단하지 말고, <b>무엇을 하라고 하는지</b>와 <b>어디서 확인하라고 하는지</b>를 보세요</div>
      <div class="two">
        <div class="card box"><h2>오늘 배운 것</h2><p class="muted" style="margin-bottom:.3rem">헷갈린 문자</p>${lessons}</div>
        <div class="card box"><h2>잡은 피싱 수법</h2>${tags}</div>
      </div>
      <div class="card box"><h2>내 최고 기록</h2><p><b>${myBest}점</b>${newBest ? " (새 최고 기록!)" : ""}</p></div>
      <div class="card box" id="rankbox"><h2>순위표</h2><p class="muted">불러오는 중이에요...</p></div>
      <div class="row"><button class="btn" id="again">다시 하기</button><a class="btn sub" href="/">처음으로</a></div>
      <p class="muted">[다시 하기]로 이어서 도전하면, 내 최고 점수만 순위표에 올라가요.</p>
    </div>`;
  show("res"); $("again").onclick = start; rankFlow(sc);
}
// ===== 순위표 (A 11/24, 서버 약속 11번) =====
// 하는 일: 별명이 있으면 이번 점수를 바로 올리고, 없으면 순위표와 별명 칸을 보여 준다. 별명은 이 기기에 기억한다
// 참고: 별명과 점수는 화면에 넣을 때 esc()로 바꿔서, 코드가 들어 있어도 글자로만 보인다
function rankRender(d, form) {
  const box = $("rankbox"); if (!box) return;
  if (!d || !d.ready) { box.innerHTML = `<h2>순위표</h2><p class="muted">순위표를 불러오지 못했어요.</p>`; return; }
  const list = d.top.map((r, i) => `<li class="${r.me ? "me" : ""}"><b>${i + 1}</b><span>${esc(r.nick)}${r.team ? `<span class="tag">기록 깨기 도전!</span>` : ""}</span><strong>${r.score}점</strong></li>`).join("");
  box.innerHTML = `<h2>순위표</h2>${d.new_top ? `<div class="newtop">새 1등!</div>` : ""}<ol class="rk">${list}</ol>` +
    (form ? `<p class="muted" style="margin-top:.7rem">별명을 정하면 이번 점수가 순위표에 올라가요.</p>
      <div class="nickrow"><input id="nick" maxlength="10" placeholder="별명 (10자까지)"><button class="btn" id="nickgo">올리기</button></div>`
      : `<p class="muted" style="margin-top:.6rem">별명: ${esc(rankNick())} <button class="back-btn" id="nickch" style="margin:0 0 0 .4rem">별명 바꾸기</button></p>`);
  if (form) $("nickgo").onclick = () => { const v = $("nick").value.trim(); if (!v) return; try { localStorage.setItem("cp_game_nick", v); } catch (e) { /* 넘어감 */ } rankSend(); };
  else $("nickch").onclick = () => { try { localStorage.removeItem("cp_game_nick"); } catch (e) { /* 넘어감 */ } rankRender(d, true); };
}
function rankNick() { try { return localStorage.getItem("cp_game_nick") || ""; } catch (e) { return ""; } }
let rankScore = 0;
function rankSend() {
  fetch("/api/rank", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ player: gamePlayer(), nick: rankNick(), score: rankScore }) })
    .then(r => r.json()).then(d => rankRender(d, false)).catch(() => rankRender(null));
}
function rankFlow(score) {
  rankScore = score;
  if (rankNick()) return rankSend();
  fetch("/api/rank").then(r => r.json()).then(d => rankRender(d, true)).catch(() => rankRender(null));
}
// ===== 소리 (A 11/23) =====
// 하는 일: 게임처럼 "뿅" 소리를 브라우저가 직접 만들어 낸다 (웹 오디오, 소리 파일 없음)
// 참고: 폰은 사용자가 먼저 눌러야 소리를 낼 수 있어서 [시작하기]를 누를 때 소리 장치를 켠다. 끄면 이 기기에 기억한다
let AC = null, MUTED = false;
try { MUTED = localStorage.getItem("cp_game_muted") === "1"; } catch (e) { /* 저장 안 되면 켜진 채로 */ }
function audio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type = "sine", vol = .18, delay = 0, slide = 0) {
  if (MUTED) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const SCALE = [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319];   // 도 레 미 파 솔 라 시 도 레 미
const SFX = {
  hit: c => { const f = SCALE[Math.min(c - 1, SCALE.length - 1)]; tone(f, .12, "square", .09); tone(f * 2, .1, "sine", .06, .05); },   // 콤보마다 음이 한 칸씩 올라감
  fanfare: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .16, "square", .09, i * .08)); tone(1568, .35, "triangle", .1, .32); },
  wrong: () => tone(220, .28, "sawtooth", .08, 0, 110),
  miss: () => tone(330, .14, "triangle", .12, 0, 180),
  level: () => [659, 784, 988].forEach((f, i) => tone(f, .14, "triangle", .12, i * .09)),
  tick: () => tone(1400, .05, "square", .05),
  end: () => [784, 659, 523, 784].forEach((f, i) => tone(f, .2, "triangle", .12, i * .14))
};
function setMuted(m) {
  MUTED = m; try { localStorage.setItem("cp_game_muted", m ? "1" : "0"); } catch (e) { /* 저장 안 되면 넘어감 */ }
  [["snd0", "🔊 소리 켜짐", "🔇 소리 꺼짐"], ["snd1", "🔊", "🔇"]].forEach(([id, on, off]) => {
    const b = $(id); b.textContent = m ? off : on; b.setAttribute("aria-pressed", String(m)); b.setAttribute("aria-label", m ? "소리 켜기" : "소리 끄기"); });
}
["snd0", "snd1"].forEach(id => $(id).onclick = () => { setMuted(!MUTED); if (!MUTED) { audio(); tone(880, .08, "square", .07); } });
setMuted(MUTED);
// 하는 일: 3, 5, 10, 15, 20... 콤보마다 팡파르와 큰 글씨 (보통 게임처럼 콤보를 강조)
const MILE = c => c === 3 || c === 5 || (c >= 10 && c % 5 === 0);
function popCombo(c) {
  const p = $("pop"); p.textContent = `${c} 콤보${"!".repeat(c >= 10 ? 3 : c >= 5 ? 2 : 1)} ×${MULT(c)}`;
  p.classList.remove("on"); void p.offsetWidth; p.classList.add("on"); SFX.fanfare();
  // 수정 (A 11/24): "동작 줄이기"를 켠 기기는 애니메이션이 없어 글자가 끝까지 남았다 (체험자 제보). 0.9초 뒤 직접 지운다
  clearTimeout(popCombo.t); popCombo.t = setTimeout(() => p.classList.remove("on"), 900);
}

// 하는 일: 한 판이 끝나면 숫자만 서버에 보낸다 (서버 약속 10번, 장부와 다른 표, A 11/20)
// 이유: 게임의 교육 효과(틀렸다가 다시 나온 문자를 맞힌 비율, 판을 거듭할수록 정확도)를 시범 운영 숫자로 보여 주려고
// 참고: 이 기기에서만 쓰는 익명 게임 번호(G+6자리)와 몇 번째 판인지를 브라우저에 남긴다. 이름·별명은 보내지 않는다.
//       저장이 안 되는 브라우저(사생활 보호 모드 등)에서는 번호를 판마다 새로 만들고, 보내기가 실패해도 화면은 그대로
// 수정 (A 11/24): 게임 번호 만들기를 따로 뺐다. 순위표도 같은 번호를 쓴다
let tmpPlayer = null;
function gamePlayer() {
  const mkId = () => "G" + Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  try {
    let p = localStorage.getItem("cp_game_player");
    if (!/^G[0-9A-F]{6}$/.test(p || "")) { p = mkId(); localStorage.setItem("cp_game_player", p); }
    return p;
  } catch (e) { return tmpPlayer || (tmpPlayer = mkId()); }
}
function sendLog(nums) {
  let player = gamePlayer(), playNo = 1;
  try {
    playNo = Math.min(1000, (parseInt(localStorage.getItem("cp_game_plays") || "0", 10) || 0) + 1);
    localStorage.setItem("cp_game_plays", String(playNo));
  } catch (e) { /* 저장 안 되면 1번째 판으로 */ }
  try {
    fetch("/api/train-log", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ player, play_no: playNo, ...nums }) }).catch(() => {});
  } catch (e) { /* 보내기 실패는 무시 */ }
}
// 하는 일: 게임 중에 나가기. 점수는 아직 어디에도 저장하지 않아서 중간에 나가도 기록 문제는 없다
$("quit").onclick = () => {
  if (!confirm("게임을 그만하고 처음 화면으로 갈까요?")) return;
  run = false; clearInterval(iv); show("st");
};
$("gobtn").onclick = () => { audio(); start(); };   // 참고: 누르는 순간 소리 장치를 켠다 (폰 정책)

// 하는 일: ☰ 메뉴 열고 닫기
const side = $("side"), menuBtn = $("menuBtn");
const setMenu = open => { side.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); };
menuBtn.onclick = () => setMenu(!side.classList.contains("open"));
document.addEventListener("click", e => { if (side.classList.contains("open") && !side.contains(e.target) && e.target !== menuBtn) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
</script>
